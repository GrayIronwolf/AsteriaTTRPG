name: Asteria Account ID release (manual, gated)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only inventory or separately approved Account ID callable deployment'
        required: true
        type: choice
        default: inventory
        options:
          - inventory
          - callable-deploy
      production_confirmation:
        description: 'For callable-deploy only type DEPLOY-ASTERIA-ACCOUNT-ID-CALLABLE; leave blank for inventory'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: firebase-account-id-release
  cancel-in-progress: false
jobs:
  account_id_inventory:
    name: Read-only Account ID function inventory
    if: github.ref == 'refs/heads/main' && inputs.operation == 'inventory'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/account-id-production-finalization.mjs --check
      - uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Cloud Functions inventory only
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/account-id-functions.txt"
          {
            echo '## Account ID deployment inventory (read-only)'
            if grep -Eq '(^|/)asteriaAccountIdentity$' "$RUNNER_TEMP/account-id-functions.txt"; then
              echo 'Account ID callable: listed in production'
            else
              echo 'Account ID callable: not listed in production'
            fi
            echo 'No Account ID issued, deployed or migrated; production flags unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
  account_id_deploy:
    name: Separately approved Account ID callable-only deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'callable-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-ACCOUNT-ID-CALLABLE'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:account-id
      - run: npm test
      - run: npm run test:firebase
      - run: node scripts/account-id-production-finalization.mjs --check
      - uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy only Account ID callable (no rules or other functions)
        run: >-
          npx firebase deploy --project asteria-ttrpg
          --only functions:asteria:asteriaAccountIdentity
          --non-interactive
      - name: Release boundaries
        run: |
          echo 'Only the Account ID callable was deployed. This job does not enable backend Account ID issuance, website registration, legacy backfill, notifications, or emails.' >> "$GITHUB_STEP_SUMMARY"
