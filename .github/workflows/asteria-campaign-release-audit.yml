name: Asteria coordinated campaign and Friends source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/asteria-release.json'
      - 'scripts/asteria-release-source.mjs'
      - 'docs/ASTERIA-CAMPAIGN-FRIENDS-RELEASE-SOURCE-OF-TRUTH.md'
      - '.github/workflows/asteria-campaign-release-audit.yml'
permissions:
  contents: read
concurrency:
  group: asteria-campaign-release-read-only
  cancel-in-progress: false
jobs:
  source_audit:
    name: One source of truth and production rollout guard (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify canonical website flags and existing fail-closed campaign rollout contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/asteria-release-source.mjs --check
          node scripts/campaign-phase8-3-release.mjs --audit > "$RUNNER_TEMP/asteria-release-static.json"
      - name: Publish one coordinated readiness report without requiring new Google Cloud IAM
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const manifest=JSON.parse(readFileSync('config/asteria-release.json','utf8'));
          const source=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/asteria-release-static.json','utf8'));
          if(source.staticChecksPassed!==true)throw Error('Source rollout safeguards failed.');
          const rows=[
            '## Asteria coordinated Campaign/Friends — authoritative source audit',
            '',
            'Project: asteria-ttrpg; region: us-central1.',
            'Canonical website manifest: config/asteria-release.json.',
            '',
            '| Check | Result |',
            '| --- | --- |',
            '| Website feature switches match manifest | Verified |',
            '| Phase 8.3 source-only rollout safeguards | Verified |',
            '| Release configuration | '+manifest.status+' |',
            '| Seven campaign/friend callable names | Declared in manifest; not rechecked live |',
            '| Production functions and signing secret | Not rechecked: only the existing trusted Firebase deployment workflow has Google Cloud access |',
            '| Production rules, backups, v2 migration and real account tests | No independent live evidence in this build |',
            '',
            '**Decision: NO-GO for public activation until independently verified production evidence and a reviewed live rollout.**',
            'This automatic workflow is offline. It does not authenticate to Google Cloud, change IAM, deploy or activate functions, migrate campaigns, read secret values, or send email.',
            'Previously verified installation runs: #59, #61, and #65; their historical success is not a current production readiness verdict.',
            ''
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\n'));
          console.log('Canonical source audit passed; separate production go/no-go remains required.');
          NODE
