name: Build Advanced Dice 3D on test branch (no Firebase deploy)
on:
  push:
    branches: [Website-Build-Test]
    paths:
      - 'src/dice/**'
      - 'src/dashboards/AdvancedDiceWorkspace.jsx'
      - 'src/styles/advanced-dice.css'
      - 'scripts/dice-engine-phase1.test.mjs'
      - 'scripts/dice-engine-phase2.test.mjs'
      - 'scripts/dice-engine-phase3-1.test.mjs'
      - 'scripts/dice-engine-phase3-2.test.mjs'
      - 'scripts/dice-engine-phase3-3.test.mjs'
      - 'scripts/dice-engine-phase3-4.test.mjs'
      - 'scripts/dice-prototype/phase2*'
      - 'scripts/dice-prototype/phase3-2*'
      - 'scripts/dice-prototype/phase3-3*'
      - 'scripts/dice-prototype/phase3-4*'
      - 'scripts/digital-gm-phase7-1.test.mjs'
      - 'package.json'
      - '.github/workflows/build-advanced-dice-phase1.yml'
permissions:
  contents: write
concurrency:
  group: asteria-advanced-dice-phase1
  cancel-in-progress: true
jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update lockfile for the pinned 3D engine
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Verify dice rules, rendering adapter and lint
        run: |
          npm run test:advanced-dice
          npm run lint
      - name: Build React/Vite site on test branch only
        run: npm run build
      - name: Install isolated browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Verify the redesigned dice tray in Chromium
        run: node scripts/dice-prototype/phase2-runner.mjs
      - name: Verify twelve Asteria PBR dice in Chromium
        run: node scripts/dice-prototype/phase3-2-runner.mjs
      - name: Verify Familiar Dice artwork and animations in Chromium
        run: node scripts/dice-prototype/phase3-3-runner.mjs
      - name: Verify Watcher Dice transparent shell and animated eyes in Chromium
        run: node scripts/dice-prototype/phase3-4-runner.mjs
      - name: Store Watcher Phase 3.4 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-dice-phase3-4
          path: dice-phase3-4-evidence/
          if-no-files-found: warn
      - name: Store Phase 3.3 Familiar Dice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-dice-phase3-3
          path: dice-phase3-3-evidence/
          if-no-files-found: warn
      - name: Store Phase 3.2 preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-dice-phase3-2
          path: dice-phase3-2-evidence/
          if-no-files-found: warn
      - name: Store Phase 2 responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-dice-phase2-ui
          path: dice-phase2-evidence/
          if-no-files-found: warn
      - name: Commit generated lockfile and built assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Generated files are already in sync."
            exit 0
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin Website-Build-Test
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
            echo "Test branch advanced; not pushing stale bundle."
            exit 1
          fi
          git commit -m "build(dice): synchronize 3D engine lockfile and React bundle [skip ci]"
          git push origin HEAD:Website-Build-Test
