name: Rebuild Campaign Artwork Production Bundle
on:
  push:
    branches: [feat/campaign-artwork-forge-manager]
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-artwork-forge-manager
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ui
      - run: npm run build
      - name: Commit production bundles
        shell: bash
        run: |
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Production assets match source"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild campaign artwork production bundles"
            git push origin HEAD:feat/campaign-artwork-forge-manager
          fi
