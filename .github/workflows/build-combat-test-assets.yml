name: Compile React website assets for Website-Build-Test (no deployment)

on:
  push:
    branches: [Website-Build-Test]
    paths:
      - 'src/dashboards/combat/**'
      - 'src/dashboards/GMDashboard.jsx'
      - 'src/dashboards/CharacterDashboard.jsx'
      - 'src/components/DashboardNavigation.jsx'
      - 'src/components/DashboardNavigation.module.css'
      - 'src/components/WorkspaceUI.jsx'
      - 'src/state/dashboardMenuModel.mjs'
      - 'src/state/gmToolkitModel.mjs'
      - 'src/styles/asteria-react.css'
      - 'src/dashboards/CombatPanel.jsx'
      - 'src/devFixtures.js'
      - 'src/styles/combat.css'
      - 'src/state/combatProgressionCore.mjs'
      - '.github/workflows/build-combat-test-assets.yml'

permissions:
  contents: write

concurrency:
  group: asteria-combat-test-build
  cancel-in-progress: true

jobs:
  compile-and-save:
    if: github.ref == 'refs/heads/Website-Build-Test' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate combat replacement and source imports
        run: |
          npm run lint
          node --test scripts/combat-command-centre-replacement.test.mjs
      - name: Build website without publishing it
        run: npm run build
      - name: Commit only compiled website artifacts on test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Compiled bundle already matches tracked artifacts."
            exit 0
          fi
          git commit -m "build(combat): synchronize compiled React bundle on Website-Build-Test [skip ci]"
          git push origin HEAD:Website-Build-Test
