name: Digital GM Phase 8.2 — Weather & Environmental Generator
on:
  push:
    branches: [feat/digital-gm-phase8-2-weather-environment]
  pull_request:
    paths:
      - 'functions/weatherEnvironmentCommands.mjs'
      - 'src/state/weatherEnvironmentModel.mjs'
      - 'src/dashboards/WeatherEnvironmentWorkspace.jsx'
      - 'src/styles/weather-environment.css'
      - 'scripts/digital-gm-phase8-2*.test.mjs'
      - 'docs/releases/digital-gm-phase8-2.md'
      - 'functions/asteriaCalendarCommands.mjs'
      - 'src/state/asteriaCalendarModel.mjs'
      - 'src/dashboards/AsteriaCalendarWorkspace.jsx'
      - 'src/dashboards/CharacterDashboard.jsx'
      - 'src/styles/asteria-calendar.css'
      - 'scripts/digital-gm-phase8-1*.test.mjs'
      - 'docs/releases/digital-gm-phase8-1.md'
      - 'functions/encounterRewardCommands.mjs'
      - 'src/state/encounterRewardModel.mjs'
      - 'src/dashboards/GMEncounterRewardWorkspace.jsx'
      - 'src/styles/encounter-rewards.css'
      - 'scripts/digital-gm-phase7-3*.test.mjs'
      - 'functions/randomTableCommands.mjs'
      - 'functions/commands.mjs'
      - 'functions/handler.mjs'
      - 'firestore.rules'
      - 'src/state/randomTableModel.mjs'
      - 'src/dashboards/GMRandomTableWorkspace.jsx'
      - 'src/dashboards/GMDashboard.jsx'
      - 'src/state/gmToolkitModel.mjs'
      - 'src/styles/random-tables.css'
      - 'src/firebase/asteriaFirebaseService.js'
      - 'js/firebase-auth.js'
      - 'scripts/digital-gm-phase7-2*.test.mjs'
      - 'docs/releases/digital-gm-phase7-2.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Random table model and existing digital GM tests
        run: node --test scripts/digital-gm-phase8-2.test.mjs scripts/digital-gm-phase8-1.test.mjs scripts/digital-gm-phase7-3.test.mjs scripts/digital-gm-phase7-2.test.mjs scripts/digital-gm-phase7-1.test.mjs scripts/digital-gm-phase6-1.test.mjs scripts/digital-gm-phase6-2.test.mjs scripts/digital-gm-phase6-3.test.mjs
      - name: Firestore and Storage access emulator tests
        run: npx firebase emulators:exec --project demo-asteria-maps --only firestore,storage "node --test scripts/digital-gm-phase8-2-emulator.test.mjs scripts/digital-gm-phase8-1-emulator.test.mjs scripts/digital-gm-phase7-3-emulator.test.mjs scripts/digital-gm-phase7-2-emulator.test.mjs scripts/digital-gm-phase7-1-emulator.test.mjs scripts/digital-gm-phase6-1-emulator.test.mjs scripts/digital-gm-phase6-2-emulator.test.mjs scripts/digital-gm-phase6-3-emulator.test.mjs"
      - name: Lint
        run: npm run lint
      - name: Existing dashboard and combat regressions
        run: npm run test:dashboard && npm run test:combat
      - name: Production React build
        run: npm run build

  bundle:
    name: Publish verified frontend bundle to Phase 8.2 branch
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/digital-gm-phase8-2-weather-environment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated website bundle after verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/digital-gm-phase8-2-weather-environment
          if [ "$(git rev-parse origin/feat/digital-gm-phase8-2-weather-environment)" != "$GITHUB_SHA" ]; then
            echo "Source advanced; a newer workflow owns bundle publication."
            exit 0
          fi
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Compiled frontend matches checked-in assets."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build Digital GM Phase 8.2 frontend bundle"
          git fetch origin feat/digital-gm-phase8-2-weather-environment
          git rebase origin/feat/digital-gm-phase8-2-weather-environment
          git push origin HEAD:feat/digital-gm-phase8-2-weather-environment
