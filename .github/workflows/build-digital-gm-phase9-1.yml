name: Digital GM Phase 9.1 — Session Notes and PDF Library
on:
  push:
    branches: [feat/digital-gm-phase9-1-session-library]
  pull_request:
    paths:
      - 'functions/sessionLibraryCommands.mjs'
      - 'src/state/sessionLibraryModel.mjs'
      - 'src/dashboards/SessionLibraryWorkspace.jsx'
      - 'src/styles/session-library.css'
      - 'scripts/digital-gm-phase9-1*.test.mjs'
      - 'docs/releases/digital-gm-phase9-1.md'
      - 'firestore.rules'
      - 'storage.rules'
      - 'functions/commands.mjs'
      - 'functions/handler.mjs'
      - 'js/firebase-auth.js'
      - 'src/firebase/asteriaFirebaseService.js'
      - 'src/dashboards/GMDashboard.jsx'
      - 'src/dashboards/CharacterDashboard.jsx'
      - 'src/state/gmToolkitModel.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Session library unit and earlier Digital GM regression tests
        run: node --test scripts/digital-gm-phase9-1.test.mjs scripts/digital-gm-phase8-3.test.mjs scripts/digital-gm-phase8-2.test.mjs scripts/digital-gm-phase8-1.test.mjs
      - name: Firebase Firestore and Storage rules emulators
        run: npx firebase emulators:exec --project demo-asteria-library --only firestore,storage "node --test scripts/digital-gm-phase9-1-emulator.test.mjs && node --test scripts/digital-gm-phase8-3-emulator.test.mjs"
      - name: Lint
        run: npm run lint
      - name: Existing GM dashboard regression tests
        run: npm run test:dashboard
      - name: Production React build
        run: npm run build

  bundle:
    name: Publish verified Phase 9.1 website bundle
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/digital-gm-phase9-1-session-library'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit verified frontend assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/digital-gm-phase9-1-session-library
          if [ "$(git rev-parse origin/feat/digital-gm-phase9-1-session-library)" != "$GITHUB_SHA" ]; then
            echo "Source advanced; newer workflow owns bundle publication."
            exit 0
          fi
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Compiled website matches checked-in assets."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build Digital GM Phase 9.1 frontend bundle"
          git fetch origin feat/digital-gm-phase9-1-session-library
          git rebase origin/feat/digital-gm-phase9-1-session-library
          git push origin HEAD:feat/digital-gm-phase9-1-session-library
