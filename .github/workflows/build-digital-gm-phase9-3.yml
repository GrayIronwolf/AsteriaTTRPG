name: Digital GM Phase 9.3 — Recording & Archives
on:
  push:
    branches: [feat/digital-gm-phase9-3-session-recording-archives]
  pull_request:
    paths:
      - 'functions/sessionRecordingCommands.mjs'
      - 'src/state/sessionRecordingModel.mjs'
      - 'src/dashboards/SessionRecordingWorkspace.jsx'
      - 'src/styles/session-recording.css'
      - 'scripts/digital-gm-phase9-3*.test.mjs'
      - 'docs/releases/digital-gm-phase9-3.md'
      - 'functions/commands.mjs'
      - 'functions/handler.mjs'
      - 'js/firebase-auth.js'
      - 'src/firebase/asteriaFirebaseService.js'
      - 'src/dashboards/GMDashboard.jsx'
      - 'src/dashboards/CharacterDashboard.jsx'
      - 'src/state/gmToolkitModel.mjs'
      - 'firestore.rules'
      - 'storage.rules'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Phase 9.3 and earlier Digital GM model tests
        run: node --test scripts/digital-gm-phase9-3.test.mjs scripts/digital-gm-phase9-2.test.mjs scripts/digital-gm-phase9-1.test.mjs scripts/digital-gm-phase8-3.test.mjs scripts/digital-gm-phase8-2.test.mjs scripts/digital-gm-phase8-1.test.mjs
      - name: Firebase consent and archive rules emulators
        run: npx firebase emulators:exec --project demo-asteria-recording --only firestore,storage "node --test scripts/digital-gm-phase9-3-emulator.test.mjs && node --test scripts/digital-gm-phase9-2-emulator.test.mjs && node --test scripts/digital-gm-phase9-1-emulator.test.mjs"
      - name: Lint
        run: npm run lint
      - name: Dashboard and character regressions
        run: npm run test:dashboard && npm run test:react
      - name: Production React build
        run: npm run build
  bundle:
    name: Publish verified Phase 9.3 website bundle
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/digital-gm-phase9-3-session-recording-archives'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit verified frontend build to phase branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/digital-gm-phase9-3-session-recording-archives
          if [ "$(git rev-parse origin/feat/digital-gm-phase9-3-session-recording-archives)" != "$GITHUB_SHA" ]; then
            echo "Source advanced; another workflow owns bundle publication."
            exit 0
          fi
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "No changes to built frontend assets."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build Digital GM Phase 9.3 frontend bundle"
          git fetch origin feat/digital-gm-phase9-3-session-recording-archives
          git rebase origin/feat/digital-gm-phase9-3-session-recording-archives
          git push origin HEAD:feat/digital-gm-phase9-3-session-recording-archives
