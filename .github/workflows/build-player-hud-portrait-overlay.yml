name: Build Player HUD Portrait Overlay Assets
on:
  push:
    branches: [feat/player-hud-portrait-overlays-level-shield]
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/player-hud-portrait-overlays-level-shield
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ui
      - run: npm run build
      - name: Commit source-matching website bundles
        shell: bash
        run: |
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Production bundles already match source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build Player HUD cinematic overlays and crystal shield"
            git push origin HEAD:feat/player-hud-portrait-overlays-level-shield
          fi
