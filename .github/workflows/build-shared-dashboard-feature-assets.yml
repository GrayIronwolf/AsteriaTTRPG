name: Compile shared dashboard feature assets (no deployment)
on:
  push:
    branches: [shared-dashboard-layout-standard]
    paths:
      - 'src/**'
      - 'vite.config.mjs'
      - 'package.json'
      - 'scripts/shared-dashboard-layout-standard.test.mjs'
      - '.github/workflows/build-shared-dashboard-feature-assets.yml'
permissions:
  contents: write
concurrency:
  group: shared-dashboard-feature-assets
  cancel-in-progress: true
jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify shared dashboard regression tests and source lint
        run: |
          npm run test:dashboard-standard
          npm run lint
      - name: Compile website assets without deploying
        run: npm run build
      - name: Commit generated assets to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Compiled assets already match source."
            exit 0
          fi
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git commit -m "build(dashboard): synchronize React assets [skip ci]"
          git fetch --no-tags origin shared-dashboard-layout-standard
          if [ "$(git rev-parse FETCH_HEAD)" != "$ORIGINAL_SHA" ]; then
            echo "Feature branch advanced; skip stale bundle."
            exit 0
          fi
          git push origin HEAD:shared-dashboard-layout-standard
