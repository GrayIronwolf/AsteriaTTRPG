name: Rebuild dashboard editor tile bundles
on:
  push:
    branches: [fix/dashboard-editor-visible-tiles-text-sizes-20261107]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-editor-visible-tiles-text-sizes-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit production assets and clean up temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/dashboard-editor-tile-build.yml
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts .github/workflows/dashboard-editor-tile-build.yml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild dashboard editor tile production assets'
            git push
          fi
