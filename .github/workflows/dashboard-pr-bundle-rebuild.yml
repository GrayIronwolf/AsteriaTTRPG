name: Rebuild dashboard PR production assets
on:
  push:
    branches:
      - feature/dashboard-editor-persistence-rework
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    if: github.repository == 'GrayIronwolf/AsteriaTTRPG' && github.ref == 'refs/heads/feature/dashboard-editor-persistence-rework'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated website bundle to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Build dashboard editor production assets"
            git push origin HEAD:feature/dashboard-editor-persistence-rework
          fi
