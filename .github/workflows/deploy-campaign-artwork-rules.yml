name: Deploy Campaign Artwork Rules (release 82)
on:
  push:
    branches: [main]
    paths:
      - 'storage.rules'
      - 'firestore.rules'
      - '.github/workflows/deploy-campaign-artwork-rules.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  deploy-artwork-rules:
    if: startsWith(github.event.head_commit.message, 'Deploy campaign artwork release #82')
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run test:firebase
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy scoped Firebase rules only
        run: npx firebase deploy --project asteria-ttrpg --only firestore:rules,storage --non-interactive
