name: Asteria 3D dice isolated prototype (no deployment)
on:
  push:
    branches: [Website-Build-Test]
    paths:
      - 'scripts/dice-prototype/**'
      - '.github/workflows/dice-3d-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund open-dice-dnd@1.13.0 three@0.180.0 cannon-es@0.20.0 playwright@1.56.1
          google-chrome --version
      - name: Run Open Dice 3D integration and animation test
        run: node scripts/dice-prototype/runner.mjs
      - name: Upload browser screenshots and test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-dice-3d-prototype
          path: dice-prototype-evidence/
          if-no-files-found: warn
