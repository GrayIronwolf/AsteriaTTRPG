name: Firebase and website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: node scripts/test-xp-realtime-sync.js
      - run: node --test scripts/data-sync-regression.test.mjs
      - run: npm run test:firebase
      - run: npm run build
      - name: Verify committed website bundle matches source
        run: git diff --exit-code -- react-dist
