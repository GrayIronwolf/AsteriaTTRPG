name: Firebase and website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm run release:check
      - run: npm run audit:campaign-coordinated
      - run: npm run content:check
      - run: npm run lint
      - run: npm test
      - run: node scripts/test-xp-realtime-sync.js
      - run: node --test scripts/data-sync-regression.test.mjs
      - run: npm run test:firebase
      - name: Exercise isolated Account ID release packaging (offline, no cloud)
        run: |
          node scripts/account-id-release-package.mjs --stage-ci
          npm install --prefix "$RUNNER_TEMP/asteria-account-id-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-account-id-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-account-id-release/functions/index.mjs"
          (cd "$RUNNER_TEMP/asteria-account-id-release/functions" && npm pack --dry-run --json > "$RUNNER_TEMP/asteria-account-id-pack-manifest.json")
          node scripts/account-id-release-cli-verify.mjs --verify-archive
      - name: Verify isolated username-only callable package (offline)
        run: |
          node scripts/account-username-release-package.mjs --check
          node scripts/account-username-release-package.mjs --stage-ci
          npm install --prefix "$RUNNER_TEMP/asteria-username-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-username-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-username-release/functions/index.mjs"
      - name: Verify isolated Friends Phase 1.2 lookup callable (offline, no deployment)
        run: |
          node scripts/friends-phase1-2-release-package.mjs --check
          node scripts/friends-phase1-2-release-package.mjs --stage-ci
          npm install --prefix "$RUNNER_TEMP/asteria-friends-lookup-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-friends-lookup-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-friends-lookup-release/functions/index.mjs"
      - name: Verify isolated disabled Friends Phase 2.2 request backend (offline)
        run: |
          node scripts/friends-phase2-2-release-package.mjs --check
          node scripts/friends-phase2-2-release-package.mjs --stage-ci
          npm install --prefix "$RUNNER_TEMP/asteria-friend-requests-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-friend-requests-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-friend-requests-release/functions/index.mjs"
          test "$(cat "$RUNNER_TEMP/asteria-friend-requests-release/functions/.env.asteria-ttrpg")" = "ASTERIA_FRIEND_REQUESTS_ENABLED=0"
      - name: Verify isolated Firebase CLI dependencies (offline)
        run: |
          mkdir -p "$RUNNER_TEMP/asteria-account-id-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-account-id-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
          node scripts/account-id-release-cli-verify.mjs --check
      - name: Exercise isolated campaign core packaging and Firebase CLI dependency ABI (offline)
        run: |
          set -euo pipefail
          node scripts/campaign-backend-scoped-release.mjs --check
          node scripts/campaign-backend-scoped-release.mjs --stage-ci
          npm install --prefix "$RUNNER_TEMP/asteria-campaign-core-release" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-campaign-core-release" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-campaign-core-release/functions/index.mjs"
          (cd "$RUNNER_TEMP/asteria-campaign-core-release" && npm pack --dry-run --json > "$RUNNER_TEMP/asteria-campaign-core-pack-manifest.json")
          node - "$RUNNER_TEMP" <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const dir=process.argv[2];
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'asteria-campaign-core-pack-manifest.json'),'utf8'));
          const pkg=manifest[0]?.files?.map(f=>f.path)||[];
          if(manifest.length!==1||!pkg.includes('functions/index.mjs')||
             !pkg.includes('functions/campaignJoinApproval.mjs')||
             !pkg.includes('src/state/characterIntegrityModel.mjs')||
             pkg.some(p=>p.includes('.env')||p.includes('campaignEmailSecrets')||
               p.includes('ASTERIA_RESEND_API_KEY')))
            throw Error('Campaign upload package has unexpected files.');
          const cli=require('node:module').createRequire(
            path.join(dir,'asteria-account-id-cli/node_modules/firebase-tools/package.json'));
          const mm=cli('minimatch');
          const version=cli('minimatch/package.json').version;
          if(typeof mm!=='function'||!/^3\./.test(version)||!mm('test.mjs','*.mjs'))
            throw Error('Isolated CLI does not support legacy minimatch API.');
          console.log('Offline campaign package and CLI dependency ABI verified.');
          NODE
      - run: npm run build
      - name: Verify committed website bundle matches source
        run: git diff --exit-code -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
