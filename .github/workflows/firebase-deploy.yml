        run: |
          node scripts/friends-notifications-scoped-release.mjs --check
          node scripts/friends-notifications-scoped-rules.mjs --check
      - name: Prepare local Firestore rules history for read-only comparison
        run: git fetch --no-tags --deepen=80 origin main
      - name: Authenticate using existing restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Cloud Functions and Firestore rule inventory
        shell: bash
        run: |
          set -euo pipefail
          echo '## Friends notification production inventory' >> "$GITHUB_STEP_SUMMARY"
          echo 'Project asteria-ttrpg; no production writes performed.' >> "$GITHUB_STEP_SUMMARY"
          gcloud functions list --project asteria-ttrpg --regions us-central1 --v2 --format='table(name,state)' | grep -E 'NAME|asteriaFriendNotifications|asteriaFriendRequests' || true
          token="$(gcloud auth print-access-token)"
          release="$(curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/projects/asteria-ttrpg/releases/cloud.firestore")"
          ruleset="$(printf '%s' "$release" | jq -r '.rulesetName // empty')"
          if [[ ! "$ruleset" =~ ^projects/asteria-ttrpg/rulesets/[A-Za-z0-9_-]+$ ]]; then
            echo 'Could not verify currently published default Firestore ruleset.' >&2
            exit 1
          fi
          curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/$ruleset"             -o "$RUNNER_TEMP/asteria-live-friend-ruleset.json"
          node scripts/friends-notifications-scoped-rules.mjs --audit-ruleset             "$RUNNER_TEMP/asteria-live-friend-ruleset.json" | tee "$RUNNER_TEMP/asteria-notification-rule-audit.json"
          echo '### Read-only Firestore rules comparison' >> "$GITHUB_STEP_SUMMARY"
          jq -r '"State: \(.state) | Deployment permitted: \(.deploymentPermitted) | Historical match: \(.historicalMatch.commit // "none")"' "$RUNNER_TEMP/asteria-notification-rule-audit.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'No changes were made to the live Firestore rules. Drift requires a reviewed reconciliation before deployment.' >> "$GITHUB_STEP_SUMMARY"

  friend_notifications_rules:
    name: Deploy only reviewed friend notification Firestore deny rules
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'friend-notifications-rules-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-FRIEND-NOTIFICATION-RULES'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
