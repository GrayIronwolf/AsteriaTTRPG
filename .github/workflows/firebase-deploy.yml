        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Fetch and validate exact live ruleset
        id: validate_rules
        shell: bash
        env:
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
          ASTERIA_NOTIFICATION_OPERATION: ${{ inputs.operation }}
          ASTERIA_NOTIFICATION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          release="$(curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/projects/asteria-ttrpg/releases/cloud.firestore")"
          ruleset="$(printf '%s' "$release" | jq -r '.rulesetName // empty')"
          if [[ ! "$ruleset" =~ ^projects/asteria-ttrpg/rulesets/[A-Za-z0-9_-]+$ ]]; then
            echo 'Default Firestore rules release not found. Deployment refused.' >&2
            exit 1
          fi
          curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/$ruleset"             -o "$RUNNER_TEMP/asteria-live-friend-ruleset.json"
          result="$(node scripts/friends-notifications-scoped-rules.mjs --stage-production             "$RUNNER_TEMP/asteria-live-friend-ruleset.json")"
          echo "$result" | jq '{state,baselineSha256,approvedSha256}'
          state="$(printf '%s' "$result" | jq -r .state)"
          if [ "$state" = "already-current" ]; then
            echo "deploy_needed=false" >> "$GITHUB_OUTPUT"
            echo 'Approved private rules are already deployed; no write needed.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$state" = "ready" ] || [ "$state" = "ready-pinned-legacy" ]; then
            echo "deploy_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Unexpected rules state; deployment refused.' >&2
            exit 1
          fi
      - name: Install pinned Firebase CLI, isolated from website
        if: steps.validate_rules.outputs.deploy_needed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/asteria-notifications-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-notifications-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
      - name: Deploy only default Firestore security rules, never indexes or Storage
        if: steps.validate_rules.outputs.deploy_needed == 'true'
        working-directory: ${{ runner.temp }}/asteria-friends-notification-rules
        run: |
          "$RUNNER_TEMP/asteria-notifications-cli/node_modules/.bin/firebase" deploy             --project asteria-ttrpg --only firestore:rules --non-interactive
      - name: Confirm live rules match reviewed content after deployment
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          release="$(curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/projects/asteria-ttrpg/releases/cloud.firestore")"
          ruleset="$(printf '%s' "$release" | jq -r '.rulesetName // empty')"
          if [[ ! "$ruleset" =~ ^projects/asteria-ttrpg/rulesets/[A-Za-z0-9_-]+$ ]]; then
            echo 'Cannot verify deployed rules release.' >&2
            exit 1
          fi
          curl -fsS --retry 2 -H "Authorization: Bearer $token"             "https://firebaserules.googleapis.com/v1/$ruleset"             -o "$RUNNER_TEMP/asteria-verified-friend-ruleset.json"
          node scripts/friends-notifications-scoped-rules.mjs --compare-ruleset             "$RUNNER_TEMP/asteria-verified-friend-ruleset.json" |             jq -e '.state == "already-current"'
          echo 'Published reviewed rules confirmed. No Firestore documents, indexes, Storage, Functions or Hosting were deployed.' >> "$GITHUB_STEP_SUMMARY"

