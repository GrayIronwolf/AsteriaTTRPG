name: Deploy Firebase backend (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose a safe identity test or a separately approved production deploy'
        required: true
        type: choice
        default: auth-check
        options:
          - auth-check
          - backup-audit
          - campaign-backend-inventory
          - campaign-backend-deploy
          - account-id-inventory
          - account-id-activation-audit
          - account-id-callable-deploy
          - account-profile-avatar-rules-deploy
          - friends-lookup-deploy
          - friends-lookup-activate
          - friends-lookup-deactivate
          - friends-request-backend-deploy
          - friends-request-backend-activate
          - friends-request-backend-deactivate
          - friend-notifications-inventory
          - friend-notifications-rules-deploy
          - friend-notifications-callable-deploy
          - friend-notifications-activation-audit
          - friend-notifications-read-activate
          - friend-notifications-read-deactivate
          - friend-notifications-events-activate
          - friend-notifications-events-deactivate
          - campaign-friends-release-audit
          - campaign-friends-recipients-deploy-off
          - campaign-friends-recipients-enable
          - campaign-friends-recipients-disable
          - campaign-friends-invites-deploy-off
          - campaign-friends-invites-enable
          - campaign-friends-invites-disable
          - deploy
      production_confirmation:
        description: 'Production actions require exact per-operation confirmation. Friends notifications rules: DEPLOY-ASTERIA-FRIEND-NOTIFICATION-RULES; disabled callable: DEPLOY-ASTERIA-FRIEND-NOTIFICATIONS-OFF. Leave blank for inventory and audits.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  auth_check:
    name: Google Cloud authentication only (no deployment)
    if: github.ref == 'refs/heads/main' && inputs.operation == 'auth-check'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate via the existing restricted Workload Identity Provider
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Verify authentication result (no Firebase changes)
        env:
          AUTH_PROJECT_ID: ${{ steps.google_auth.outputs.project_id }}
        run: |
          test "$AUTH_PROJECT_ID" = "asteria-ttrpg"
          test -n "${GOOGLE_GHA_CREDS_PATH:-}"
          test -s "$GOOGLE_GHA_CREDS_PATH"
          echo "GitHub OIDC identity authenticated for asteria-ttrpg."
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect deployed Cloud Functions (read-only; permissions may limit visibility)
        id: functions_inventory
        continue-on-error: true
        run: |
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='table(name,state,updateTime)'
      - name: Summarise safe check
        env:
          INVENTORY_OUTCOME: ${{ steps.functions_inventory.outcome }}
        run: |
          echo "## Firebase production authentication (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Workload Identity authentication completed for project asteria-ttrpg." >> "$GITHUB_STEP_SUMMARY"
          if [ "$INVENTORY_OUTCOME" = "success" ]; then
            echo "Cloud Functions inventory was listed without making changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cloud Functions inventory could not be listed; review IAM/read permissions separately." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No Firebase deployment, feature flags, email sending or data migration were executed." >> "$GITHUB_STEP_SUMMARY"
  backup_audit:
    name: Firebase backup and configuration inventory (metadata only)
    if: github.ref == 'refs/heads/main' && inputs.operation == 'backup-audit'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using the existing restricted GitHub Workload Identity Provider
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect backup metadata (read-only; never exports or restores)
        env:
          ASTERIA_AUDIT_OPERATION: backup-audit
        run: node scripts/firebase-production-backup-audit.mjs --live
  deploy:
    name: Approved Firebase production deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-PRODUCTION'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm test
      - run: npm run test:firebase
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy reviewed backend to the explicit production project
        run: npx firebase deploy --project asteria-ttrpg --only functions,firestore,storage --non-interactive

  campaign_backend_inventory:
    name: Campaign backend callable inventory (read-only)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'campaign-backend-inventory'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using restricted GitHub Workload Identity (read-only)
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Compare callable inventory without reading user data
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-functions.txt"
          {
            echo '## Asteria campaign backend inventory (read-only)'
            echo 'Project: asteria-ttrpg | Region: us-central1'
            echo 'No deployment, Security Rules change, feature activation or migration occurred.'
            echo ''
            echo '| Callable | Cloud Functions inventory |'
            echo '| --- | --- |'
            for fn in asteriaAction asteriaInvite asteriaCampaignUCN asteriaMembershipPreparation asteriaCampaignAccessCutover asteriaCampaignJoinRequest asteriaCampaignJoinReview asteriaSecureInvitation asteriaCampaignNotifications asteriaCampaignEmailInvitations; do
              if grep -Eq "(^|/)${fn}$" "$RUNNER_TEMP/asteria-functions.txt"; then
                echo "| ${fn} | Listed |"
              else
                echo "| ${fn} | Not listed |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  campaign_backend_deploy:
    name: Separately approved campaign functions-only release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'campaign-backend-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-CAMPAIGN-BACKEND'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Check dependencies and production rollout guards
        run: |
          npm run audit:production
          npm run test:rollout
      - run: npm test
      - run: npm run test:firebase
      - name: Authenticate using restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Confirm the existing legacy callables are present (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-functions.txt"
          grep -Eq '(^|/)asteriaAction$' "$RUNNER_TEMP/asteria-functions.txt"
          grep -Eq '(^|/)asteriaInvite$' "$RUNNER_TEMP/asteria-functions.txt"
      - name: Verify reviewed five-function package without cloud writes
        run: |
          node scripts/campaign-backend-scoped-release.mjs --check
          node --test scripts/campaign-backend-scoped-release.test.mjs
      - name: Require all five core campaign functions to be absent before initial deployment
        shell: bash
        run: |
          set -euo pipefail
          for target in asteriaCampaignUCN asteriaMembershipPreparation asteriaCampaignAccessCutover asteriaCampaignJoinRequest asteriaCampaignJoinReview; do
            if grep -Eq "(^|/)${target}$" "$RUNNER_TEMP/asteria-functions.txt"; then
              echo "Refusing to overwrite existing core campaign function: $target" >&2
              exit 1
            fi
          done
      - name: Stage isolated, secret-free campaign package in runner temp
        shell: bash
        env:
          ASTERIA_CAMPAIGN_OPERATION: ${{ inputs.operation }}
          ASTERIA_CAMPAIGN_CONFIRMATION: ${{ inputs.production_confirmation }}
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
        run: |
          set -euo pipefail
          node scripts/campaign-backend-scoped-release.mjs --stage
          npm install --prefix "$RUNNER_TEMP/asteria-campaign-core-release" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-campaign-core-release" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-campaign-core-release/functions/index.mjs"
      - name: Install isolated pinned Firebase CLI (no repository overrides)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asteria-campaign-core-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-campaign-core-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
          node scripts/account-id-release-cli-verify.mjs --check
          node - "$RUNNER_TEMP/asteria-campaign-core-cli" <<'NODE'
          const {createRequire}=require('node:module');
          const {join}=require('node:path');
          const cli=createRequire(join(process.argv[2],'node_modules/firebase-tools/package.json'));
          const mm=cli('minimatch');
          const info=cli('minimatch/package.json');
          if(typeof mm!=='function'||!/^3\./.test(info.version)||
             mm('source.mjs','*.mjs')!==true)
            throw Error('Isolated campaign Firebase CLI minimatch API mismatch.');
          console.log('Campaign Firebase CLI minimatch ABI verified: '+info.version);
          NODE
      - name: Deploy exactly five isolated core campaign callables (no secrets, rules or email)
        working-directory: ${{ runner.temp }}/asteria-campaign-core-release
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/asteria-campaign-core-cli/node_modules/firebase-tools/lib/bin/firebase.js" deploy --project asteria-ttrpg \
            --only "functions:asteria:asteriaCampaignUCN,functions:asteria:asteriaMembershipPreparation,functions:asteria:asteriaCampaignAccessCutover,functions:asteria:asteriaCampaignJoinRequest,functions:asteria:asteriaCampaignJoinReview" \
            --non-interactive
      - name: Verify only the expected five functions are now listed
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-campaign-post-deploy.txt"
          for target in asteriaCampaignUCN asteriaMembershipPreparation asteriaCampaignAccessCutover asteriaCampaignJoinRequest asteriaCampaignJoinReview; do
            grep -Eq "(^|/)${target}$" "$RUNNER_TEMP/asteria-campaign-post-deploy.txt" || {
              echo "Expected core campaign function missing: $target" >&2
              exit 1
            }
          done
          for target in asteriaAction asteriaInvite; do
            grep -Eq "(^|/)${target}$" "$RUNNER_TEMP/asteria-campaign-post-deploy.txt" || {
              echo "Existing legacy campaign function unexpectedly absent: $target" >&2
              exit 1
            }
          done
          echo '## Scoped campaign core deployment' >> "$GITHUB_STEP_SUMMARY"
          echo 'Five previously absent core campaign callables are listed after isolated deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production feature flags were enabled; no Firestore/Storage rules, Hosting, email delivery or invitation secrets were deployed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source-only deployment is not approval for campaign v2 activation.' >> "$GITHUB_STEP_SUMMARY"

  account_id_inventory:
    name: Read-only Account ID function inventory
    if: github.ref == 'refs/heads/main' && inputs.operation == 'account-id-inventory'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/account-id-production-finalization.mjs --check
      - uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Cloud Functions inventory only
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/account-id-functions.txt"
          {
            echo '## Account ID deployment inventory (read-only)'
            if grep -Eq '(^|/)asteriaAccountIdentity$' "$RUNNER_TEMP/account-id-functions.txt"; then
              echo 'Account ID callable: listed in production'
            else
              echo 'Account ID callable: not listed in production'
            fi
            echo 'No Account ID issued, deployed or migrated; production flags unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
  account_id_activation_audit:
    name: Read-only Account ID production activation inventory
    if: github.ref == 'refs/heads/main' && inputs.operation == 'account-id-activation-audit'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using the existing restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Summarise callable flags and published rules without exposing values
        env:
          ASTERIA_AUDIT_OPERATION: account-id-activation-audit
        run: node scripts/account-id-production-readiness.mjs --live

  account_id_deploy:
    name: Separately approved Account ID callable-only deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'account-id-callable-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-ACCOUNT-ID-CALLABLE'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm run audit:account-id
      - run: npm test
      - run: npm run test:firebase
      - run: node scripts/account-id-production-finalization.mjs --check
      - uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Stage verified Account ID release package outside website workspace
        env:
          ASTERIA_ACCOUNT_ID_SCOPED_DEPLOY: '1'
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
        run: |
          node scripts/account-id-release-package.mjs --stage-production
          npm install --prefix "$RUNNER_TEMP/asteria-account-id-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-account-id-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-account-id-release/functions/index.mjs"
      - name: Install isolated pinned Firebase CLI and verify legacy minimatch API
        run: |
          mkdir -p "$RUNNER_TEMP/asteria-account-id-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-account-id-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
          node scripts/account-id-release-cli-verify.mjs --check
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify existing campaign callables before scoped deployment (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-functions-before.txt"
          grep -Eq '(^|/)asteriaAction$' "$RUNNER_TEMP/asteria-functions-before.txt"
          grep -Eq '(^|/)asteriaInvite$' "$RUNNER_TEMP/asteria-functions-before.txt"
      - name: Deploy Account ID callable from clean release directory only
        working-directory: ${{ runner.temp }}/asteria-account-id-release
        run: >-
          node "${{ runner.temp }}/asteria-account-id-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          deploy --project asteria-ttrpg
          --only functions:asteria:asteriaAccountIdentity
          --non-interactive
      - name: Verify Account ID and both existing callables (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='csv[no-heading](name,state)' > "$RUNNER_TEMP/asteria-functions-after.csv"
          for fn in asteriaAccountIdentity asteriaAction asteriaInvite; do
            grep -Eq "(^|/)${fn},ACTIVE$" "$RUNNER_TEMP/asteria-functions-after.csv"
          done
      - name: Release boundaries
        run: |
          echo 'Only the Account ID callable was deployed. This job does not enable backend Account ID issuance, website registration, legacy backfill, notifications, or emails.' >> "$GITHUB_STEP_SUMMARY"

  account_profile_avatar_rules:
    name: Separately approved Account avatar Storage rules only
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'account-profile-avatar-rules-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-PROFILE-AVATAR-RULES'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify account profile tests and full Firebase Security Rules
        run: |
          npm run test:account-profile
          npm run test:firebase
      - name: Authenticate with existing production Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy Storage rules only, no Functions or Firestore
        run: npx firebase deploy --project asteria-ttrpg --only storage --non-interactive
      - name: Confirm deployment boundary
        run: |
          echo 'Reviewed Storage rules deployed to asteria-ttrpg.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Firebase Functions, Firestore documents, Auth users, or Account IDs were changed.' >> "$GITHUB_STEP_SUMMARY"

  friends_lookup_deploy:
    name: Separately approved Friends account lookup only
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'friends-lookup-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-FRIENDS-LOOKUP'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Test secure lookup and Firebase security rules
        run: |
          npm run audit:production
          npm run test:friends-phase1-2
          npm run test:firebase
          node scripts/friends-phase1-2-release-package.mjs --check
      - name: Authenticate with approved production Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Stage one clean, disabled-by-default callable
        env:
          ASTERIA_FRIENDS_SCOPED_DEPLOY: '1'
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
          ASTERIA_FRIENDS_OPERATION: ${{ inputs.operation }}
          ASTERIA_FRIENDS_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          node scripts/friends-phase1-2-release-package.mjs --stage-production
          npm install --prefix "$RUNNER_TEMP/asteria-friends-lookup-release/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/asteria-friends-lookup-release/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/asteria-friends-lookup-release/functions/index.mjs"
      - name: Install isolated pinned Firebase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/asteria-friends-lookup-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-friends-lookup-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
      - name: Deploy only Friends account lookup, leave feature gate off
        working-directory: ${{ runner.temp }}/asteria-friends-lookup-release
        run: |
          "$RUNNER_TEMP/asteria-friends-lookup-cli/node_modules/.bin/firebase" deploy --project asteria-ttrpg --only functions:asteria:asteriaFriendAccountLookup --non-interactive
      - name: Record strict deployment boundary
        run: |
          echo 'Deployed only asteriaFriendAccountLookup to existing asteria-ttrpg.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ASTERIA_FRIEND_LOOKUP_ENABLED is not enabled by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No other functions, account identities, invitations, rules, Firebase Hosting, or website files changed.' >> "$GITHUB_STEP_SUMMARY"

  friends_lookup_activation:
    name: Separately approved Friends search activation or rollback
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (
        (inputs.operation == 'friends-lookup-activate' &&
         inputs.production_confirmation == 'ACTIVATE-ASTERIA-FRIENDS-LOOKUP') ||
        (inputs.operation == 'friends-lookup-deactivate' &&
         inputs.production_confirmation == 'DEACTIVATE-ASTERIA-FRIENDS-LOOKUP')
      )
