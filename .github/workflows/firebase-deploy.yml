name: Deploy Firebase backend (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose a safe identity test or a separately approved production deploy'
        required: true
        type: choice
        default: auth-check
        options:
          - auth-check
          - backup-audit
          - campaign-backend-inventory
          - campaign-backend-deploy
          - deploy
      production_confirmation:
        description: 'For deploy type DEPLOY-ASTERIA-PRODUCTION; for campaign-backend-deploy type DEPLOY-ASTERIA-CAMPAIGN-BACKEND. Leave blank for audits.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: firebase-production
  cancel-in-progress: false
jobs:
  auth_check:
    name: Google Cloud authentication only (no deployment)
    if: github.ref == 'refs/heads/main' && inputs.operation == 'auth-check'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate via the existing restricted Workload Identity Provider
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Verify authentication result (no Firebase changes)
        env:
          AUTH_PROJECT_ID: ${{ steps.google_auth.outputs.project_id }}
        run: |
          test "$AUTH_PROJECT_ID" = "asteria-ttrpg"
          test -n "${GOOGLE_GHA_CREDS_PATH:-}"
          test -s "$GOOGLE_GHA_CREDS_PATH"
          echo "GitHub OIDC identity authenticated for asteria-ttrpg."
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect deployed Cloud Functions (read-only; permissions may limit visibility)
        id: functions_inventory
        continue-on-error: true
        run: |
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='table(name,state,updateTime)'
      - name: Summarise safe check
        env:
          INVENTORY_OUTCOME: ${{ steps.functions_inventory.outcome }}
        run: |
          echo "## Firebase production authentication (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "Workload Identity authentication completed for project asteria-ttrpg." >> "$GITHUB_STEP_SUMMARY"
          if [ "$INVENTORY_OUTCOME" = "success" ]; then
            echo "Cloud Functions inventory was listed without making changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cloud Functions inventory could not be listed; review IAM/read permissions separately." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "No Firebase deployment, feature flags, email sending or data migration were executed." >> "$GITHUB_STEP_SUMMARY"
  backup_audit:
    name: Firebase backup and configuration inventory (metadata only)
    if: github.ref == 'refs/heads/main' && inputs.operation == 'backup-audit'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate using the existing restricted GitHub Workload Identity Provider
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect backup metadata (read-only; never exports or restores)
        env:
          ASTERIA_AUDIT_OPERATION: backup-audit
        run: node scripts/firebase-production-backup-audit.mjs --live
  deploy:
    name: Approved Firebase production deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-PRODUCTION'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm test
      - run: npm run test:firebase
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy reviewed backend to the explicit production project
        run: npx firebase deploy --project asteria-ttrpg --only functions,firestore,storage --non-interactive

  campaign_backend_inventory:
    name: Campaign backend callable inventory (read-only)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'campaign-backend-inventory'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using restricted GitHub Workload Identity (read-only)
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Compare callable inventory without reading user data
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-functions.txt"
          {
            echo '## Asteria campaign backend inventory (read-only)'
            echo 'Project: asteria-ttrpg | Region: us-central1'
            echo 'No deployment, Security Rules change, feature activation or migration occurred.'
            echo ''
            echo '| Callable | Cloud Functions inventory |'
            echo '| --- | --- |'
            for fn in asteriaAction asteriaInvite asteriaCampaignUCN asteriaMembershipPreparation asteriaCampaignAccessCutover asteriaCampaignJoinRequest asteriaCampaignJoinReview asteriaSecureInvitation asteriaCampaignNotifications asteriaCampaignEmailInvitations; do
              if grep -Eq "(^|/)${fn}$" "$RUNNER_TEMP/asteria-functions.txt"; then
                echo "| ${fn} | Listed |"
              else
                echo "| ${fn} | Not listed |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  campaign_backend_deploy:
    name: Separately approved campaign functions-only release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'campaign-backend-deploy' &&
      inputs.production_confirmation == 'DEPLOY-ASTERIA-CAMPAIGN-BACKEND'
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Check dependencies and production rollout guards
        run: |
          npm run audit:production
          npm run test:rollout
      - run: npm test
      - run: npm run test:firebase
      - name: Authenticate using restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Confirm the existing legacy callables are present (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project=asteria-ttrpg --regions=us-central1 --v2 --format='value(name)' > "$RUNNER_TEMP/asteria-functions.txt"
          grep -Eq '(^|/)asteriaAction$' "$RUNNER_TEMP/asteria-functions.txt"
          grep -Eq '(^|/)asteriaInvite$' "$RUNNER_TEMP/asteria-functions.txt"
      - name: Deploy only five staged campaign callables (no existing functions, rules or storage)
        run: >
          npx firebase deploy --project asteria-ttrpg
          --only "functions:asteria:asteriaCampaignUCN,functions:asteria:asteriaMembershipPreparation,functions:asteria:asteriaCampaignAccessCutover,functions:asteria:asteriaCampaignJoinRequest,functions:asteria:asteriaCampaignJoinReview"
          --non-interactive
      - name: Record deployment scope
        run: |
          echo '## Separately approved, functions-only Asteria campaign release' >> "$GITHUB_STEP_SUMMARY"
          echo 'Five campaign callables only; no legacy callable, Firestore rules, indexes, Storage rules, website, feature flag, email sender or migration was deployed by this job.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This step does not establish production readiness for public feature activation.' >> "$GITHUB_STEP_SUMMARY"
