  friend_notifications_activation_audit:
    name: Audit notification activation flags (read-only)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'friend-notifications-activation-audit' &&
      inputs.production_confirmation == ''
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prepared isolated activation bundles
        run: |
          node scripts/friends-notifications-activation-release.mjs --check
          node scripts/friends-notifications-scoped-rules.mjs --check
      - name: Authenticate using existing trusted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect live flags and published Firestore rules (no writes)
        shell: bash
        run: |
          set -euo pipefail
          request_enabled="$(gcloud functions describe asteriaFriendRequests --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_REQUESTS_ENABLED)')"
          event_enabled="$(gcloud functions describe asteriaFriendRequests --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_NOTIFICATIONS_ENABLED)')"
          read_enabled="$(gcloud functions describe asteriaFriendNotifications --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_NOTIFICATIONS_ENABLED)')"
          test -n "$request_enabled"
          test -n "$read_enabled"
          event_enabled="${event_enabled:-0}"
          for value in "$request_enabled" "$event_enabled" "$read_enabled"; do
            if [ "$value" != 0 ] && [ "$value" != 1 ]; then echo "Unexpected live feature flag." >&2; exit 1; fi
          done
          token="$(gcloud auth print-access-token)"
          release="$(curl -fsS --retry 2 -H "Authorization: Bearer $token" "https://firebaserules.googleapis.com/v1/projects/asteria-ttrpg/releases/cloud.firestore")"
          ruleset="$(printf '%s' "$release" | jq -r '.rulesetName // empty')"
          if [[ ! "$ruleset" =~ ^projects/asteria-ttrpg/rulesets/[A-Za-z0-9_-]+$ ]]; then echo 'Unknown Firestore rules release.' >&2; exit 1; fi
          curl -fsS --retry 2 -H "Authorization: Bearer $token" "https://firebaserules.googleapis.com/v1/$ruleset" -o "$RUNNER_TEMP/asteria-notification-active-rules.json"
          node scripts/friends-notifications-scoped-rules.mjs --compare-ruleset "$RUNNER_TEMP/asteria-notification-active-rules.json" | jq -e '.state == "already-current"'
          echo "## Friends notification activation readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "Project asteria-ttrpg, active reviewed Firestore rules confirmed. No production writes." >> "$GITHUB_STEP_SUMMARY"
          echo "Friend Requests availability: $request_enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Friend notification event emission: $event_enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Friend notification read endpoint: $read_enabled" >> "$GITHUB_STEP_SUMMARY"
          echo 'Website default remains disabled in source. Live account testing and website rollout require separate approval.' >> "$GITHUB_STEP_SUMMARY"

  friend_notifications_activation:
    name: Explicitly approved Friends notifications activation or rollback (one callable)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (
        (inputs.operation == 'friend-notifications-read-activate' &&
         inputs.production_confirmation == 'ACTIVATE-ASTERIA-FRIEND-NOTIFICATION-READS') ||
        (inputs.operation == 'friend-notifications-read-deactivate' &&
         inputs.production_confirmation == 'DEACTIVATE-ASTERIA-FRIEND-NOTIFICATION-READS') ||
        (inputs.operation == 'friend-notifications-events-activate' &&
         inputs.production_confirmation == 'ACTIVATE-ASTERIA-FRIEND-NOTIFICATION-EVENTS') ||
        (inputs.operation == 'friend-notifications-events-deactivate' &&
         inputs.production_confirmation == 'DEACTIVATE-ASTERIA-FRIEND-NOTIFICATION-EVENTS')
      )
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate social notification events, access and server-only rules
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == *-deactivate ]]; then
            # Emergency rollback must remain available after a later website
            # activation; older UI tests assert the website flag is still false.
            node --check scripts/friends-notifications-activation-release.mjs
            node --check functions/friendNotifications.mjs
            node --check functions/friendRequestActions.mjs
            node --check functions/friendNotificationThrottle.mjs
            npm run test:friends-phase2-2
          else
            npm run audit:production
            npm run test:friends-phase2-2
            npm run test:friends-phase4-1
            npm run test:friends-phase4-2
            npm run test:friends-phase4-3
            npm run test:friends-notifications-activation
            npm run test:firebase
          fi
      - name: Authenticate using existing trusted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check live flags, prerequisites and reviewed rules (before any write)
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            friend-notifications-read-activate|friend-notifications-read-deactivate|friend-notifications-events-activate|friend-notifications-events-deactivate) ;;
            *) echo 'Unexpected activation operation.' >&2; exit 1 ;;
          esac
          request_enabled="$(gcloud functions describe asteriaFriendRequests --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_REQUESTS_ENABLED)')"
          event_enabled="$(gcloud functions describe asteriaFriendRequests --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_NOTIFICATIONS_ENABLED)')"
          read_enabled="$(gcloud functions describe asteriaFriendNotifications --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_NOTIFICATIONS_ENABLED)')"
          event_enabled="${event_enabled:-0}"
          test -n "$request_enabled"
          test -n "$read_enabled"
          for value in "$request_enabled" "$event_enabled" "$read_enabled"; do
            if [ "$value" != 0 ] && [ "$value" != 1 ]; then echo 'Unrecognized live backend flag.' >&2; exit 1; fi
          done
          if [ "$OPERATION" = friend-notifications-events-activate ] &&
             { [ "$request_enabled" != 1 ] || [ "$read_enabled" != 1 ]; }; then
            echo 'Activate inbox reads and verify request availability before recording events.' >&2; exit 1
          fi
          if [ "$OPERATION" = friend-notifications-read-deactivate ] &&
             [ "$event_enabled" != 0 ]; then
            echo 'Disable event creation before disabling notification reads.' >&2; exit 1
          fi
          case "$OPERATION" in
            *-activate)
              token="$(gcloud auth print-access-token)"
              release="$(curl -fsS --retry 2 -H "Authorization: Bearer $token" "https://firebaserules.googleapis.com/v1/projects/asteria-ttrpg/releases/cloud.firestore")"
              ruleset="$(printf '%s' "$release" | jq -r '.rulesetName // empty')"
              if [[ ! "$ruleset" =~ ^projects/asteria-ttrpg/rulesets/[A-Za-z0-9_-]+$ ]]; then echo 'Cannot verify rules.' >&2; exit 1; fi
              curl -fsS --retry 2 -H "Authorization: Bearer $token" "https://firebaserules.googleapis.com/v1/$ruleset" -o "$RUNNER_TEMP/asteria-notification-current-rules.json"
              node scripts/friends-notifications-scoped-rules.mjs --compare-ruleset "$RUNNER_TEMP/asteria-notification-current-rules.json" | jq -e '.state == "already-current"'
              ;;
            *-deactivate)
              echo 'Rollback can proceed without an exact rules match, to fail closed.'
              ;;
          esac
          echo "ASTERIA_CURRENT_FRIEND_REQUESTS_ENABLED=$request_enabled" >> "$GITHUB_ENV"
          echo "Existing request availability=$request_enabled; event emission=$event_enabled; inbox read=$read_enabled" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage one isolated function with explicit reversible flags
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ASTERIA_NOTIFICATION_ACTIVATION_OPERATION: ${{ inputs.operation }}
          ASTERIA_NOTIFICATION_ACTIVATION_CONFIRMATION: ${{ inputs.production_confirmation }}
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
        run: |
          set -euo pipefail
          node scripts/friends-notifications-activation-release.mjs --stage "$OPERATION"
          case "$OPERATION" in
            friend-notifications-read-activate)
              directory=asteria-friend-notification-reads-activation; target=asteriaFriendNotifications; enabled=1 ;;
            friend-notifications-read-deactivate)
              directory=asteria-friend-notification-reads-activation; target=asteriaFriendNotifications; enabled=0 ;;
            friend-notifications-events-activate)
              directory=asteria-friend-notification-events-activation; target=asteriaFriendRequests; enabled=1 ;;
            friend-notifications-events-deactivate)
              directory=asteria-friend-notification-events-activation; target=asteriaFriendRequests; enabled=0 ;;
            *) exit 1 ;;
          esac
          if [ "$target" = asteriaFriendNotifications ]; then
            test "$(cat "$RUNNER_TEMP/$directory/functions/.env.asteria-ttrpg")" = "ASTERIA_FRIEND_NOTIFICATIONS_ENABLED=$enabled"
          else
            printf 'ASTERIA_FRIEND_REQUESTS_ENABLED=%s\nASTERIA_FRIEND_NOTIFICATIONS_ENABLED=%s\n' "$ASTERIA_CURRENT_FRIEND_REQUESTS_ENABLED" "$enabled" | cmp - "$RUNNER_TEMP/$directory/functions/.env.asteria-ttrpg"
          fi
          npm install --prefix "$RUNNER_TEMP/$directory/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/$directory/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/$directory/functions/index.mjs"
          echo "NOTIFICATION_RELEASE_DIRECTORY=$directory" >> "$GITHUB_ENV"
          echo "NOTIFICATION_RELEASE_TARGET=$target" >> "$GITHUB_ENV"
          echo "NOTIFICATION_RELEASE_ENABLED=$enabled" >> "$GITHUB_ENV"
      - name: Install pinned isolated Firebase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/asteria-notifications-activation-cli"
          npm install --prefix "$RUNNER_TEMP/asteria-notifications-activation-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
      - name: Deploy only explicitly approved notification target callable
        shell: bash
        run: |
          set -euo pipefail
          case "$NOTIFICATION_RELEASE_TARGET" in
            asteriaFriendNotifications|asteriaFriendRequests) ;;
            *) echo 'Unexpected function target.' >&2; exit 1 ;;
          esac
          cd "$RUNNER_TEMP/$NOTIFICATION_RELEASE_DIRECTORY"
          "$RUNNER_TEMP/asteria-notifications-activation-cli/node_modules/.bin/firebase" deploy --project asteria-ttrpg --only "functions:asteria:$NOTIFICATION_RELEASE_TARGET" --non-interactive
      - name: Verify deployed flags and preserved Friends request availability
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gcloud functions describe "$NOTIFICATION_RELEASE_TARGET" --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_NOTIFICATIONS_ENABLED)')"
          if [ "$actual" != "$NOTIFICATION_RELEASE_ENABLED" ]; then
            echo 'Activation or rollback could not be verified.' >&2; exit 1
          fi
          if [ "$NOTIFICATION_RELEASE_TARGET" = asteriaFriendRequests ]; then
            current="$(gcloud functions describe asteriaFriendRequests --gen2 --region us-central1 --project asteria-ttrpg --format='value(serviceConfig.environmentVariables.ASTERIA_FRIEND_REQUESTS_ENABLED)')"
            if [ "$current" != "$ASTERIA_CURRENT_FRIEND_REQUESTS_ENABLED" ]; then
              echo 'Friend request availability was unexpectedly changed.' >&2; exit 1
            fi
          fi
          echo "$NOTIFICATION_RELEASE_TARGET verified notification flag $actual." >> "$GITHUB_STEP_SUMMARY"
          echo 'Exactly one function was deployed. No Firestore rules, Storage, Hosting, email, account ID or campaign changes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Website Friends notifications remain disabled until separately approved UI activation.' >> "$GITHUB_STEP_SUMMARY"

  campaign_friends_release_audit:
    name: Phase 5.3 independent campaign prerequisites audit (no writes)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'campaign-friends-release-audit' &&
      inputs.production_confirmation == ''
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/friends-phase5-3-scoped-release.mjs --check
          node --test scripts/friends-phase5-3-release.test.mjs
      - name: Authenticate with existing restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only deployed function flags and signing secret readiness
        shell: bash
        run: |
          set -euo pipefail
          gcloud functions list --project asteria-ttrpg --regions us-central1 --v2 --format=json > "$RUNNER_TEMP/campaign-functions.json"
          for target in asteriaCampaignFriendRecipients asteriaSecureInvitation; do
            count="$(jq --arg target "$target" '[.[] | select(.name | endswith("/"+$target))] | length' "$RUNNER_TEMP/campaign-functions.json")"
            case "$count" in
              0) echo "### $target: not deployed" >> "$GITHUB_STEP_SUMMARY" ;;
              1)
                gcloud functions describe "$target" --gen2 --region us-central1 --project asteria-ttrpg --format=json > "$RUNNER_TEMP/$target.json"
                echo "### $target: deployed" >> "$GITHUB_STEP_SUMMARY"
                jq -r '.serviceConfig.environmentVariables // {} | to_entries |
                  map(select(.key|startswith("ASTERIA_"))) | .[] |
                  "\(.key)=\(if .value=="0" or .value=="1" then .value else "UNREVIEWED" end)"' \
                  "$RUNNER_TEMP/$target.json" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "Ambiguous deployed function: $target" >&2; exit 1 ;;
            esac
          done
          if gcloud secrets describe ASTERIA_SECURE_INVITE_SIGNING_KEY --project asteria-ttrpg --format='value(name)' >/dev/null 2>&1 &&
             gcloud secrets versions list ASTERIA_SECURE_INVITE_SIGNING_KEY --project asteria-ttrpg --filter='state=ENABLED' --format='value(name)' > "$RUNNER_TEMP/secret-versions.txt" &&
             [ -s "$RUNNER_TEMP/secret-versions.txt" ]; then
            echo 'Secure invitation signing secret: an enabled version is visible (no value read).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Secure invitation signing secret: NOT VERIFIED. Do not activate.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Read-only: no deployment, changes to flags, Storage, rules, email or Hosting.' >> "$GITHUB_STEP_SUMMARY"

  campaign_friends_release:
    name: Phase 5.3 confirmed single-function campaign release (manual)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (
        (inputs.operation == 'campaign-friends-recipients-deploy-off' &&
         inputs.production_confirmation == 'DEPLOY-ASTERIA-CAMPAIGN-FRIEND-RECIPIENTS-OFF') ||
        (inputs.operation == 'campaign-friends-recipients-enable' &&
         inputs.production_confirmation == 'ENABLE-ASTERIA-CAMPAIGN-FRIEND-RECIPIENTS') ||
        (inputs.operation == 'campaign-friends-recipients-disable' &&
         inputs.production_confirmation == 'DISABLE-ASTERIA-CAMPAIGN-FRIEND-RECIPIENTS') ||
        (inputs.operation == 'campaign-friends-invites-deploy-off' &&
         inputs.production_confirmation == 'DEPLOY-ASTERIA-CAMPAIGN-FRIEND-INVITES-OFF') ||
        (inputs.operation == 'campaign-friends-invites-enable' &&
         inputs.production_confirmation == 'ENABLE-ASTERIA-CAMPAIGN-FRIEND-INVITES') ||
        (inputs.operation == 'campaign-friends-invites-disable' &&
         inputs.production_confirmation == 'DISABLE-ASTERIA-CAMPAIGN-FRIEND-INVITES')
      )
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate independent invitation/security contracts
        run: |
          npm run audit:production
          npm run test:friends-phase5-1
          npm run test:friends-phase5-2
          npm run test:friends-phase5-3
          npm run test:secure-invitations
          npm run test:invitation-acceptance
          npm run test:friends-notifications-activation
          npm run test:firebase
      - name: Authenticate with existing restricted Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: asteria-ttrpg
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify live release scope and prerequisites before any write
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            campaign-friends-recipients-*) target=asteriaCampaignFriendRecipients ;;
            campaign-friends-invites-*) target=asteriaSecureInvitation ;;
            *) echo 'Unknown operation.' >&2; exit 1 ;;
          esac
          gcloud functions list --project asteria-ttrpg --regions us-central1 --v2 --format=json > "$RUNNER_TEMP/phase53-list.json"
          count="$(jq --arg target "$target" '[.[] | select(.name | endswith("/"+$target))] | length' "$RUNNER_TEMP/phase53-list.json")"
          case "$count" in
            0) printf '{"exists":false,"env":{}}\n' > "$RUNNER_TEMP/phase53-live.json" ;;
            1)
              gcloud functions describe "$target" --gen2 --region us-central1 --project asteria-ttrpg --format=json |
                jq '{exists:true,env:(.serviceConfig.environmentVariables // {})}' > "$RUNNER_TEMP/phase53-live.json" ;;
            *) echo 'Target function listing is ambiguous.' >&2; exit 1 ;;
          esac
          recipient_ready=0; acceptance_ready=0
          if [[ "$OPERATION" == campaign-friends-recipients-disable ||
                "$OPERATION" == campaign-friends-recipients-deploy-off ]]; then
            # Reverse the activation order: do not disable recipient lookup
            # while independently enabled account-bound issuance depends on it.
            secure_count="$(jq '[.[] | select(.name | endswith("/asteriaSecureInvitation"))] | length' "$RUNNER_TEMP/phase53-list.json")"
            if [ "$secure_count" = 1 ]; then
              gcloud functions describe asteriaSecureInvitation --gen2 --region us-central1 --project asteria-ttrpg --format=json > "$RUNNER_TEMP/secure-invite-state.json"
              test "$(jq -r '.serviceConfig.environmentVariables.ASTERIA_CAMPAIGN_FRIEND_INVITES_ENABLED // "0"' "$RUNNER_TEMP/secure-invite-state.json")" != 1 || {
                echo 'Disable account-bound invitation issuance before recipient lookup.' >&2; exit 1;
              }
            elif [ "$secure_count" != 0 ]; then
              echo 'Unable to prove safe recipient rollback order.' >&2; exit 1
            fi
          fi
          if [[ "$OPERATION" == campaign-friends-invites-* ]]; then
            gcloud secrets describe ASTERIA_SECURE_INVITE_SIGNING_KEY --project asteria-ttrpg --format='value(name)' >/dev/null
            gcloud secrets versions list ASTERIA_SECURE_INVITE_SIGNING_KEY --project asteria-ttrpg --filter='state=ENABLED' --format='value(name)' > "$RUNNER_TEMP/secret-versions.txt"
            test -s "$RUNNER_TEMP/secret-versions.txt" || { echo 'No enabled signing secret version verified.' >&2; exit 1; }
          fi
          if [ "$OPERATION" = campaign-friends-invites-enable ]; then
            gcloud functions describe asteriaCampaignFriendRecipients --gen2 --region us-central1 --project asteria-ttrpg --format=json > "$RUNNER_TEMP/recipient.json"
            test "$(jq -r '.serviceConfig.environmentVariables.ASTERIA_CAMPAIGN_FRIEND_RECIPIENTS_ENABLED // "0"' "$RUNNER_TEMP/recipient.json")" = 1 || { echo 'Recipient function must already be separately activated.' >&2; exit 1; }
            recipient_ready=1
            for key in ASTERIA_SECURE_INVITATIONS_ENABLED ASTERIA_INVITATION_ACCEPTANCE_ENABLED ASTERIA_INVITATION_MANAGER_ENABLED; do
              test "$(jq -r --arg key "$key" '.env[$key] // "0"' "$RUNNER_TEMP/phase53-live.json")" = 1 || { echo "Existing v2 campaign dependency not active: $key" >&2; exit 1; }
            done
            node --input-type=module -e 'import {readFileSync} from "node:fs"; const site=readFileSync("index.html","utf8"); for(const flag of ["secureInvitationManager:true","secureInvitationAcceptance:true","campaignFriendRecipients:true"])if(!site.includes(flag))throw Error("Existing v2 campaign website feature not independently approved: "+flag)'
            acceptance_ready=1
          fi
          echo "ASTERIA_PHASE53_LIVE_FILE=$RUNNER_TEMP/phase53-live.json" >> "$GITHUB_ENV"
          echo "ASTERIA_PHASE53_RECIPIENT_READY=$recipient_ready" >> "$GITHUB_ENV"
          echo "ASTERIA_PHASE53_ACCEPTANCE_READY=$acceptance_ready" >> "$GITHUB_ENV"
      - name: Stage one bounded source package, preserving live environment flags
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ASTERIA_PHASE53_OPERATION: ${{ inputs.operation }}
          ASTERIA_PHASE53_CONFIRMATION: ${{ inputs.production_confirmation }}
          ASTERIA_DEPLOY_PROJECT: asteria-ttrpg
        run: |
          set -euo pipefail
          node scripts/friends-phase5-3-scoped-release.mjs --stage "$OPERATION"
          case "$OPERATION" in
            campaign-friends-recipients-*) dir=asteria-phase53-recipients; target=asteriaCampaignFriendRecipients ;;
            campaign-friends-invites-*) dir=asteria-phase53-invites; target=asteriaSecureInvitation ;;
            *) exit 1 ;;
          esac
          npm install --prefix "$RUNNER_TEMP/$dir/functions" --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix "$RUNNER_TEMP/$dir/functions" --omit=dev --no-audit --no-fund
          node --check "$RUNNER_TEMP/$dir/functions/index.mjs"
          echo "PHASE53_DIR=$dir" >> "$GITHUB_ENV"
          echo "PHASE53_TARGET=$target" >> "$GITHUB_ENV"
      - name: Install pinned isolated Firebase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/phase53-cli"
          npm install --prefix "$RUNNER_TEMP/phase53-cli" --no-save --no-audit --no-fund firebase-tools@15.35.0
      - name: Deploy only the single selected function
        shell: bash
        run: |
          set -euo pipefail
          case "$PHASE53_TARGET" in
            asteriaCampaignFriendRecipients|asteriaSecureInvitation) ;;
            *) echo 'Unexpected function target.' >&2; exit 1 ;;
          esac
          cd "$RUNNER_TEMP/$PHASE53_DIR"
          "$RUNNER_TEMP/phase53-cli/node_modules/.bin/firebase" deploy \
            --project asteria-ttrpg --only "functions:asteria:$PHASE53_TARGET" --non-interactive
      - name: Verify deployed flag values and preserved old campaign settings
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          gcloud functions describe "$PHASE53_TARGET" --gen2 --region us-central1 --project asteria-ttrpg --format=json > "$RUNNER_TEMP/phase53-deployed.json"
          case "$OPERATION" in
            *-enable) expected=1 ;;
            *-disable|*-deploy-off) expected=0 ;;
            *) exit 1 ;;
          esac
          if [ "$PHASE53_TARGET" = asteriaCampaignFriendRecipients ]; then
            flag=ASTERIA_CAMPAIGN_FRIEND_RECIPIENTS_ENABLED
          else
            flag=ASTERIA_CAMPAIGN_FRIEND_INVITES_ENABLED
          fi
          actual="$(jq -r --arg key "$flag" '.serviceConfig.environmentVariables[$key] // "missing"' "$RUNNER_TEMP/phase53-deployed.json")"
          test "$actual" = "$expected" || { echo 'Feature state not verified.' >&2; exit 1; }
          jq -r '.serviceConfig.environmentVariables // {} | to_entries |
            map(select(.key|startswith("ASTERIA_"))) | sort_by(.key) |
            .[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/phase53-deployed.json" > "$RUNNER_TEMP/deployed-env.txt"
          grep '^ASTERIA_' "$RUNNER_TEMP/$PHASE53_DIR/functions/.env.asteria-ttrpg" | LC_ALL=C sort > "$RUNNER_TEMP/expected-env.txt"
          diff -u "$RUNNER_TEMP/expected-env.txt" "$RUNNER_TEMP/deployed-env.txt"
          echo "Verified $PHASE53_TARGET flag $flag=$actual; exactly one function changed." >> "$GITHUB_STEP_SUMMARY"
          echo 'No Firestore/Storage rules, Hosting, unrelated Cloud Functions or email system was deployed.' >> "$GITHUB_STEP_SUMMARY"
