name: Phase 5.4 Forge end-to-end acceptance

on:
  pull_request:
    paths:
      - "frontend/src/campaigns/**"
      - "frontend/src/pages/CampaignInvitationPage.jsx"
      - "frontend/src/pages/CharacterForgePage.jsx"
      - "frontend/src/auth/firebaseAuthAdapter.mjs"
      - "scripts/site-forge-integration-browser.cjs"
      - ".github/workflows/forge-phase5-4-acceptance.yml"
  workflow_dispatch:

# Keep one validation run per workflow and PR; never cancel push or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-forge-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install chromium
      - name: Build opt-in Forge integration
        env:
          VITE_ASTERIA_AUTH_ENABLED: 'true'
          VITE_ASTERIA_CHARACTER_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_CONNECTIONS_ENABLED: 'true'
          VITE_ASTERIA_FORGE_INTEGRATION_ENABLED: 'true'
          VITE_FIREBASE_MODE: emulator
        run: npm run site:build
      - name: Verify real Auth, Firestore and Functions integration
        timeout-minutes: 8
        env:
          ASTERIA_CAMPAIGN_V2_CANARY_ENABLED: '1'
          ASTERIA_JOIN_REQUESTS_ENABLED: '1'
          ASTERIA_JOIN_REVIEW_ENABLED: '1'
          ASTERIA_PLAYER_ROSTER_ENABLED: '1'
          ASTERIA_ROLE_PERMISSIONS_ENABLED: '1'
          ASTERIA_MEMBER_CONTROLS_ENABLED: '1'
          ASTERIA_INVITATION_MANAGER_ENABLED: '1'
          ASTERIA_SECURE_INVITATIONS_ENABLED: '1'
          ASTERIA_INVITATION_ACCEPTANCE_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_REQUESTS_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_APPROVAL_ENABLED: '1'
          ASTERIA_CHARACTER_LIFECYCLE_ENABLED: '1'
          ASTERIA_SECURE_INVITE_SIGNING_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          printf 'ASTERIA_SECURE_INVITE_SIGNING_KEY=%s\n' "$ASTERIA_SECURE_INVITE_SIGNING_KEY" > .secret.local
          trap 'rm -f .secret.local' EXIT
          npx firebase emulators:exec --project demo-asteria --only auth,firestore,functions,storage "npm run site:forge-integration-browser"
