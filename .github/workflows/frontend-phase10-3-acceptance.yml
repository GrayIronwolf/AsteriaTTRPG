name: React/Vite Phase 10.3 - responsive, accessibility and performance gate
on:
  pull_request:
    paths:
      - "scripts/site-cutover-phase10-1-browser.cjs"
      - "scripts/site-cutover-phase10-3-*"
      - "docs/frontend-overhaul/PHASE-10.3-VISUAL-ACCESSIBILITY-PERFORMANCE.md"
      - "package.json"
      - ".github/workflows/frontend-phase10-3-acceptance.yml"
  workflow_dispatch:
# Cancel superseded PR validation while preserving push and manually started runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  three-role-visual-a11y-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Site architecture, unit and CSS/JS ownership regression
        run: |
          npm run site:check
          npm run site:security-audit
          npm run site:retirement-audit
          npm run lint
      - name: Install test-only Chromium and accessibility engine
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0 axe-core@4.10.3
          npx playwright install chromium
      - name: Build isolated React emulator preview
        env:
          VITE_ASTERIA_AUTH_ENABLED: 'true'
          VITE_ASTERIA_CHARACTER_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_CONNECTIONS_ENABLED: 'true'
          VITE_ASTERIA_FORGE_INTEGRATION_ENABLED: 'true'
          VITE_ASTERIA_GM_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_PLAYER_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_DASHBOARD_EDITOR_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_MEDIA_ENABLED: 'true'
          VITE_ASTERIA_COMBAT_ENABLED: 'true'
          VITE_ASTERIA_PROGRESSION_ENABLED: 'true'
          VITE_ASTERIA_ECONOMY_ENABLED: 'true'
          VITE_ASTERIA_DIGITAL_GM_ENABLED: 'true'
          VITE_FIREBASE_MODE: emulator
        run: |
          npm run site:build
          npm run site:verify-dist
      - name: Real browser checks against demo Firebase emulators
        timeout-minutes: 20
        env:
          ASTERIA_PHASE_10_3_AUDIT: '1'
          ASTERIA_CAMPAIGN_V2_CANARY_ENABLED: '1'
          ASTERIA_JOIN_REQUESTS_ENABLED: '1'
          ASTERIA_JOIN_REVIEW_ENABLED: '1'
          ASTERIA_PLAYER_ROSTER_ENABLED: '1'
          ASTERIA_ROLE_PERMISSIONS_ENABLED: '1'
          ASTERIA_MEMBER_CONTROLS_ENABLED: '1'
          ASTERIA_INVITATION_MANAGER_ENABLED: '1'
          ASTERIA_SECURE_INVITATIONS_ENABLED: '1'
          ASTERIA_INVITATION_ACCEPTANCE_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_REQUESTS_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_APPROVAL_ENABLED: '1'
          ASTERIA_CHARACTER_LIFECYCLE_ENABLED: '1'
          ASTERIA_SECURE_INVITE_SIGNING_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          printf 'ASTERIA_SECURE_INVITE_SIGNING_KEY=%s\n' "$ASTERIA_SECURE_INVITE_SIGNING_KEY" > .secret.local
          trap 'rm -f .secret.local' EXIT
          npx firebase emulators:exec --project demo-asteria --only auth,firestore,functions,storage "npm run site:cutover-visual-phase10-3"
      - name: Verify accessibility, responsive and performance evidence
        run: npm run site:cutover-visual-phase10-3:report
      - name: Upload only synthetic screenshots and numerical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-10-3-responsive-a11y-performance
          path: ${{ runner.temp }}/asteria-phase-10-1-baselines/
          retention-days: 30
          if-no-files-found: error
      - name: Restore guest-only preview build
        if: always()
        run: |
          npm run site:build
          npm run site:verify-dist
