name: React/Vite Phase 6.3 - Dashboard editor acceptance

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/site-layout-*"
      - "package.json"
      - ".github/workflows/frontend-phase6-3-acceptance.yml"
  workflow_dispatch:

# Replace older runs of this workflow when the same PR receives a new commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashboard-editor-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Phase 6.3 layout model, permissions and isolation tests
        run: npm run site:check
      - name: ESLint and build checks
        run: |
          npx eslint frontend/src
          npm run site:build
          npm run site:verify-dist
      - name: Chromium for authenticated layout tests
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install chromium
      - name: Build authenticated opt-in dashboards and editor
        env:
          VITE_ASTERIA_AUTH_ENABLED: 'true'
          VITE_ASTERIA_CHARACTER_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_CONNECTIONS_ENABLED: 'true'
          VITE_ASTERIA_FORGE_INTEGRATION_ENABLED: 'true'
          VITE_ASTERIA_GM_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_PLAYER_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_DASHBOARD_EDITOR_ENABLED: 'true'
          VITE_FIREBASE_MODE: emulator
        run: npm run site:build
      - name: Two-account GM/Player layout editor emulator acceptance
        timeout-minutes: 9
        env:
          ASTERIA_CAMPAIGN_V2_CANARY_ENABLED: '1'
          ASTERIA_JOIN_REQUESTS_ENABLED: '1'
          ASTERIA_JOIN_REVIEW_ENABLED: '1'
          ASTERIA_PLAYER_ROSTER_ENABLED: '1'
          ASTERIA_ROLE_PERMISSIONS_ENABLED: '1'
          ASTERIA_MEMBER_CONTROLS_ENABLED: '1'
          ASTERIA_INVITATION_MANAGER_ENABLED: '1'
          ASTERIA_SECURE_INVITATIONS_ENABLED: '1'
          ASTERIA_INVITATION_ACCEPTANCE_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_REQUESTS_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_APPROVAL_ENABLED: '1'
          ASTERIA_CHARACTER_LIFECYCLE_ENABLED: '1'
          ASTERIA_SECURE_INVITE_SIGNING_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          printf 'ASTERIA_SECURE_INVITE_SIGNING_KEY=%s\n' "$ASTERIA_SECURE_INVITE_SIGNING_KEY" > .secret.local
          trap 'rm -f .secret.local' EXIT
          npx firebase emulators:exec --project demo-asteria --only auth,firestore,functions,storage "npm run site:layout-browser"
      - name: Restore disabled guest-only deployment artifact
        run: |
          npm run site:build
          npm run site:verify-dist
