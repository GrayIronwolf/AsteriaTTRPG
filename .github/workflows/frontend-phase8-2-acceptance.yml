name: React/Vite Phase 8.2 - Realtime subscriptions and state acceptance

on:
  pull_request:
    paths:
      - "frontend/src/runtime/**"
      - "frontend/src/auth/**"
      - "frontend/src/dashboard/**"
      - "frontend/src/player/**"
      - "frontend/src/combat/**"
      - "frontend/src/progression/**"
      - "frontend/src/economy/**"
      - "frontend/src/digitalGM/**"
      - "scripts/site-firebase-phase8-2.test.mjs"
      - "package.json"
      - ".github/workflows/frontend-phase8-2-acceptance.yml"
  workflow_dispatch:

# Cancel obsolete PR checks when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  realtime-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Realtime deduplication, ownership, revocation and stale-view regressions
        run: |
          npm run site:firebase-phase8-2
          npm run site:check
      - name: Lint, isolated preview and output integrity
        run: |
          npx eslint frontend/src
          npm run site:build
          npm run site:verify-dist
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install chromium
      - name: Build opt-in authenticated integration preview
        env:
          VITE_ASTERIA_AUTH_ENABLED: 'true'
          VITE_ASTERIA_CHARACTER_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_FORGE_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_CONNECTIONS_ENABLED: 'true'
          VITE_ASTERIA_FORGE_INTEGRATION_ENABLED: 'true'
          VITE_ASTERIA_GM_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_PLAYER_DASHBOARD_ENABLED: 'true'
          VITE_ASTERIA_DASHBOARD_EDITOR_ENABLED: 'true'
          VITE_ASTERIA_CAMPAIGN_MEDIA_ENABLED: 'true'
          VITE_ASTERIA_COMBAT_ENABLED: 'true'
          VITE_ASTERIA_PROGRESSION_ENABLED: 'true'
          VITE_ASTERIA_ECONOMY_ENABLED: 'true'
          VITE_ASTERIA_DIGITAL_GM_ENABLED: 'true'
          VITE_FIREBASE_MODE: emulator
        run: npm run site:build
      - name: Two-account GM and Player private/public realtime browser workflow
        timeout-minutes: 18
        env:
          ASTERIA_CAMPAIGN_V2_CANARY_ENABLED: '1'
          ASTERIA_JOIN_REQUESTS_ENABLED: '1'
          ASTERIA_JOIN_REVIEW_ENABLED: '1'
          ASTERIA_PLAYER_ROSTER_ENABLED: '1'
          ASTERIA_ROLE_PERMISSIONS_ENABLED: '1'
          ASTERIA_MEMBER_CONTROLS_ENABLED: '1'
          ASTERIA_INVITATION_MANAGER_ENABLED: '1'
          ASTERIA_SECURE_INVITATIONS_ENABLED: '1'
          ASTERIA_INVITATION_ACCEPTANCE_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_REQUESTS_ENABLED: '1'
          ASTERIA_CHARACTER_LINK_APPROVAL_ENABLED: '1'
          ASTERIA_CHARACTER_LIFECYCLE_ENABLED: '1'
          ASTERIA_SECURE_INVITE_SIGNING_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          printf 'ASTERIA_SECURE_INVITE_SIGNING_KEY=%s\n' "$ASTERIA_SECURE_INVITE_SIGNING_KEY" > .secret.local
          trap 'rm -f .secret.local' EXIT
          npx firebase emulators:exec --project demo-asteria --only auth,firestore,functions,storage "npm run site:digital-gm-browser"
      - name: Restore deployment-disabled guest preview
        run: |
          npm run site:build
          npm run site:verify-dist
