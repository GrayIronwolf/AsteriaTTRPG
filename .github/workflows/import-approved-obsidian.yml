name: Import Approved Obsidian Content
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  stage-approved-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify private-repo and PR credentials exist
        env:
          VAULT_READ: ${{ secrets.ASTERIA_VAULT_READ_TOKEN }}
          PR_WRITE: ${{ secrets.ASTERIA_WEBSITE_PR_TOKEN }}
        run: |
          if [ -z "$VAULT_READ" ] || [ -z "$PR_WRITE" ]; then
            echo "::error::Configure ASTERIA_VAULT_READ_TOKEN and ASTERIA_WEBSITE_PR_TOKEN in this website repository before importing."
            exit 1
          fi
      - name: Check out public website source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out private vault using read-only credential
        uses: actions/checkout@v4
        with:
          repository: GrayIronwolf/Asteria-Obsidian-Vault
          ref: main
          path: vault-source
          token: ${{ secrets.ASTERIA_VAULT_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify importer isolation and permanent ID safety
        run: node --test scripts/approved-vault-bridge.test.mjs
      - name: Validate approved public vault pages
        run: node scripts/import-approved-vault.cjs --source vault-source/publish/public --out content-import/approved --validate-only
      - name: Build only reviewed public staging records
        run: node scripts/import-approved-vault.cjs --source vault-source/publish/public --out content-import/approved
      - name: Remove private repository files from working directory
        run: rm -rf vault-source
      - name: Propose reviewed staging changes in website PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.ASTERIA_WEBSITE_PR_TOKEN }}
          commit-message: "Stage explicitly approved public Asteria vault definitions"
          branch: automation/approved-vault-content
          delete-branch: true
          title: "Review: approved public Obsidian vault content"
          body: |
            Generated by the opt-in private-to-public Asteria vault bridge.
            Only files with explicit public and publication approval flags were staged.
            This is **not** a live Compendium import. Verify content and ID mappings manually
            before approving this PR. GM-only and unpublished information must never be published.
          add-paths: |
            content-import/approved/**
