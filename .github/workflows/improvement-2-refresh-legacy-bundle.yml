name: Improvement 2 - Refresh Legacy Build Artifacts
on:
  push:
    branches: [feature/share-present-improvement-2-gm-studio]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: improvement-2-legacy-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-source-matched-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate production artifacts from Phase 2 React source
        run: npm run build
      - name: Commit generated website assets on the Phase 2 branch only
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/share-present-improvement-2-gm-studio"
          git fetch origin "$branch"
          if [ "$(git rev-parse "origin/$branch")" != "$GITHUB_SHA" ]; then
            echo "Branch advanced while building; not publishing stale artifacts."
            exit 0
          fi
          git add -A react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Generated assets already match current React source."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh verified website assets for Improvement Phase 2"
          git push origin HEAD:"$branch"
