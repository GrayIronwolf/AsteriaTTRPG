name: Phase 1.1 temporary bundle sync
on:
  push:
    branches:
      - feature/inventory-phase-1-1-integrity
    paths:
      - .github/workflows/inventory-phase-1-1-bundle-sync.yml
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated React bundles only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- react-dist
          if ! git diff --cached --quiet; then
            git commit -m "build(inventory): sync Phase 1.1 React assets"
            git push origin HEAD:feature/inventory-phase-1-1-integrity
          fi
