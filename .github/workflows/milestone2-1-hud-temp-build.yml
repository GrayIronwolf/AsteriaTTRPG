name: Milestone 2.1 HUD temporary bundle build (no deploy)
on:
  push:
    branches:
      - milestone-2-1-hud-visual-refinement
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets to isolated working branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin milestone-2-1-hud-visual-refinement
          if [ "$(git rev-parse origin/milestone-2-1-hud-visual-refinement)" != "$GITHUB_SHA" ]; then
            echo "New source revision exists; skip obsolete generated build."
            exit 0
          fi
          git add react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Generated assets already match source."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Generate Milestone 2.1 HUD React assets (no deploy)"
          git push origin HEAD:milestone-2-1-hud-visual-refinement
