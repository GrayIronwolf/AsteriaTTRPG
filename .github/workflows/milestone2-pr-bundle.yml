name: Milestone 2 verified frontend bundle (temporary PR-only)
on:
  push:
    branches:
      - milestone-2-shared-dashboard-canvas
permissions:
  contents: write
jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated React bundle to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin milestone-2-shared-dashboard-canvas
          if [ "$(git rev-parse origin/milestone-2-shared-dashboard-canvas)" != "$GITHUB_SHA" ]; then
            echo "Newer source commit exists; do not publish stale build."
            exit 0
          fi
          git add react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Generated files already match source."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Build Milestone 2 website assets (no deploy)"
          git push origin HEAD:milestone-2-shared-dashboard-canvas
