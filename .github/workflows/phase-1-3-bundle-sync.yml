name: Phase 1.3 bundle synchronization
on:
  push:
    branches: [feature/inventory-phase-1-3-private-trades]
    paths: [.github/workflows/phase-1-3-bundle-sync.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- react-dist
          if ! git diff --cached --quiet; then
            git commit -m "build(privacy): sync Phase 1.3 frontend assets"
            git push origin HEAD:feature/inventory-phase-1-3-private-trades
          fi
