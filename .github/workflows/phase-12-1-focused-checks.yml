# Temporary isolated validation for Phase 12.1; remove before merge.
name: Phase 12.1 focused emulator checks
on:
  push:
    branches:
      - test/inventory-phase-12-1-player-gm-workflows
    paths:
      - .github/workflows/phase-12-1-focused-checks.yml
      - scripts/inventory-phase-12-1-emulator.test.mjs
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --check scripts/inventory-phase-12-1-emulator.test.mjs
      - run: npm run test:inventory-phase-12-1
