# Temporary Phase 12.2 website asset regeneration; removed before merge.
name: Phase 12.2 website bundle sync
on:
  push:
    branches:
      - feat/inventory-phase-12-2-mobile-performance
    paths:
      - .github/workflows/phase-12-2-bundle-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated production assets to this feature branch only
        shell: bash
        run: |
          git add -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Website assets already match source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Phase 12.2 website assets"
          git push origin "HEAD:refs/heads/feat/inventory-phase-12-2-mobile-performance"
