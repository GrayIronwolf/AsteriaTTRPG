name: Phase 6.1A Freeform Workspace Checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/state/workspaceFreeformModel.mjs'
      - 'src/state/dashboardLayoutModel.mjs'
      - 'frontend/src/layout/**'
      - 'scripts/site-freeform-phase6-1a.test.mjs'
      - '.github/workflows/phase-6-1a-freeform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Freeform and existing dashboard layout tests
        run: node --test scripts/site-freeform-phase6-1a.test.mjs scripts/site-layout-phase6-3.test.mjs scripts/dashboard-layout.test.mjs
      - name: React and model lint
        run: npx eslint frontend/src/layout src/state/workspaceFreeformModel.mjs src/state/dashboardLayoutModel.mjs
      - name: React website checks
        run: npm run site:check
      - name: Production React website build
        run: npm run site:build

  publish-bundle:
    name: Commit verified React bundle to the Phase 6.1A branch
    needs: freeform
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/phase-6-1a-freeform-workspace-engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-6-1a-freeform-workspace-engine
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate tracked production bundle
        run: npm run build
      - name: Commit bundle only when source head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/phase-6-1a-freeform-workspace-engine
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "${{ github.event.pull_request.head.sha }}" ]; then
            echo "Newer source commit exists; refusing to write a stale bundle."
            exit 0
          fi
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then
            echo "Checked-in bundle already matches generated source."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(phase6): synchronize tracked React production bundle"
          git push origin "HEAD:$BRANCH"
