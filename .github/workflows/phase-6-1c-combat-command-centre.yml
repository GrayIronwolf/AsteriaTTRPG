name: Phase 6.1C GM Combat Command Centre Checks
on:
  pull_request:
    paths:
      - 'frontend/src/combat/**'
      - 'frontend/src/pages/GMDashboardPage.jsx'
      - 'scripts/site-freeform-phase6-1c.test.mjs'
      - '.github/workflows/phase-6-1c-combat-command-centre.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat-command-centre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 6.1A–6.1C and combat regression tests
        run: node --test scripts/site-freeform-phase6-1a.test.mjs scripts/site-freeform-phase6-1b.test.mjs scripts/site-freeform-phase6-1c.test.mjs scripts/site-combat-phase7-1.test.mjs
      - name: Lint combat and layout files
        run: npx eslint frontend/src/combat frontend/src/pages/GMDashboardPage.jsx
      - name: Full React site checks
        run: npm run site:check
      - name: Compile production React site
        run: npm run site:build
      - name: Verify production bundle
        run: npm run site:verify-dist
