name: Phase 6.3 temporary website bundle sync
on:
  push:
    branches:
      - feat/inventory-phase-6-3-batch-treasure-review
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit bundled website to Phase 6.3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist
          if ! git diff --cached --quiet; then
            git commit -m "build(phase 6.3): synchronize generated website"
            git push origin HEAD:feat/inventory-phase-6-3-batch-treasure-review
          fi
