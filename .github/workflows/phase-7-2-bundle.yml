name: Phase 7.2 temporary website bundle sync
on:
  push:
    branches:
      - feat/inventory-phase-7-2-journal-receipts-export
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit bundled website to Phase 7.2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist
          if ! git diff --cached --quiet; then
            git commit -m "build(phase 7.2): synchronize generated website"
            git push origin HEAD:feat/inventory-phase-7-2-journal-receipts-export
          fi
