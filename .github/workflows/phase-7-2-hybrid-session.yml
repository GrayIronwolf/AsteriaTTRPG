name: Phase 7.2 Hybrid Session and Viewer Permissions
on:
  push:
    branches: [feature/phase-7-2-hybrid-session-viewer-permissions]
  pull_request:
    paths:
      - 'src/state/hybridPresentationSessionModel.mjs'
      - 'functions/hybridPresentationSessionCommands.mjs'
      - 'functions/playerPresentationCommands.mjs'
      - 'functions/commands.mjs'
      - 'functions/handler.mjs'
      - 'frontend/src/dashboard/HybridSessionManager.jsx'
      - 'frontend/src/dashboard/HybridSessionManager.module.css'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.jsx'
      - 'frontend/src/dashboard/firebaseCampaignMediaService.mjs'
      - 'frontend/src/pages/PresentationPage.jsx'
      - 'firestore.rules'
      - 'scripts/site-share-present-phase7-2*.test.mjs'
      - '.github/workflows/phase-7-2-hybrid-session.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid-viewer-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Hybrid viewer lifecycle and previous Phase 7 regressions
        run: node --test scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-1.test.mjs scripts/site-share-present-phase7-0.test.mjs scripts/site-media-phase6-4.test.mjs scripts/site-combat-final-phase6-9.test.mjs
      - name: Firestore Auth and viewer restriction emulator
        run: npx firebase emulators:exec --project demo-asteria-hybrid-phase72 --only firestore "node --test scripts/site-share-present-phase7-2-emulator.test.mjs"
      - name: Lint edited code and security tests
        run: npx eslint src/state/hybridPresentationSessionModel.mjs functions/hybridPresentationSessionCommands.mjs functions/playerPresentationCommands.mjs functions/commands.mjs functions/handler.mjs frontend/src/dashboard/HybridSessionManager.jsx frontend/src/dashboard/CampaignPresentationWorkspace.jsx frontend/src/dashboard/firebaseCampaignMediaService.mjs frontend/src/pages/PresentationPage.jsx scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-2-emulator.test.mjs
      - name: Check React/Vite website
        run: npm run site:check
      - name: Build React/Vite website
        run: npm run site:build
      - name: Verify production build
        run: npm run site:verify-dist
