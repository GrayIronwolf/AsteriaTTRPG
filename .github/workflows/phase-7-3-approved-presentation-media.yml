name: Phase 7.3 Approved Presentation Media and Scenes
on:
  push:
    branches: [feature/phase-7-3-approved-presentation-media-scenes]
  pull_request:
    paths:
      - 'src/state/presentationAssetModel.mjs'
      - 'src/state/playerPresentationModel.mjs'
      - 'src/state/hybridPresentationSessionModel.mjs'
      - 'src/state/campaignMediaLibraryModel.mjs'
      - 'functions/presentationAssetCommands.mjs'
      - 'functions/playerPresentationCommands.mjs'
      - 'functions/hybridPresentationSessionCommands.mjs'
      - 'functions/commands.mjs'
      - 'functions/handler.mjs'
      - 'frontend/src/dashboard/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'scripts/site-share-present-phase7-3*.test.mjs'
      - '.github/workflows/phase-7-3-approved-presentation-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Media lifecycle and previous Phase 7 regressions
        run: node --test scripts/site-share-present-phase7-3.test.mjs scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-1.test.mjs scripts/site-share-present-phase7-0.test.mjs scripts/site-media-phase6-4.test.mjs scripts/site-combat-final-phase6-9.test.mjs
      - name: Firestore and Storage authorization emulator
        run: npx firebase emulators:exec --project demo-asteria-presentation-phase73 --only firestore,storage "node --test scripts/site-share-present-phase7-3-emulator.test.mjs"
      - name: Previously approved restricted session rules emulator
        run: npx firebase emulators:exec --project demo-asteria-hybrid-phase72 --only firestore "node --test scripts/site-share-present-phase7-2-emulator.test.mjs"
      - name: Lint edited React, server and model code
        run: npx eslint src/state/presentationAssetModel.mjs src/state/playerPresentationModel.mjs src/state/hybridPresentationSessionModel.mjs src/state/campaignMediaLibraryModel.mjs functions/presentationAssetCommands.mjs functions/playerPresentationCommands.mjs functions/hybridPresentationSessionCommands.mjs frontend/src/dashboard/PresentationMediaFrame.jsx frontend/src/dashboard/GMPresentationAssets.jsx frontend/src/dashboard/CampaignPresentationWorkspace.jsx frontend/src/dashboard/HybridSessionManager.jsx frontend/src/dashboard/firebaseCampaignMediaService.mjs scripts/site-share-present-phase7-3.test.mjs scripts/site-share-present-phase7-3-emulator.test.mjs
      - name: React/Vite source checks
        run: npm run site:check
      - name: Production React/Vite build
        run: npm run site:build
      - name: Compiled assets verification
        run: npm run site:verify-dist
