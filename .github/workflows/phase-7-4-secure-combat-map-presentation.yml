name: Phase 7.4 Secure Live Combat and Battle-Map Presentation
on:
  push:
    branches: [feature/phase-7-4-secure-live-combat-battle-map-presentation]
  pull_request:
    paths:
      - 'src/state/livePresentationProjectionModel.mjs'
      - 'functions/livePresentationProjectionTriggers.mjs'
      - 'functions/presentationProjectionBackfillCommands.mjs'
      - 'functions/playerPresentationCommands.mjs'
      - 'functions/index.mjs'
      - 'frontend/src/dashboard/**'
      - 'frontend/src/combat/firebaseCombatService.mjs'
      - 'firestore.rules'
      - 'storage.rules'
      - 'scripts/site-share-present-phase7-4*.test.mjs'
      - '.github/workflows/phase-7-4-secure-combat-map-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-combat-and-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 7.4 privacy and prior Phase 7 regression models
        run: node --test scripts/site-share-present-phase7-4.test.mjs scripts/site-share-present-phase7-3.test.mjs scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-1.test.mjs scripts/site-share-present-phase7-0.test.mjs scripts/site-combat-phase7-1.test.mjs scripts/site-combat-final-phase6-9.test.mjs
      - name: Firestore and Storage security emulator for combat and maps
        run: npx firebase emulators:exec --project demo-asteria-share-present-phase74 --only firestore,storage "node --test scripts/site-share-present-phase7-4-emulator.test.mjs"
      - name: Media and restricted viewer emulator regressions
        run: npx firebase emulators:exec --project demo-asteria-presentation-phase73 --only firestore,storage "node --test scripts/site-share-present-phase7-3-emulator.test.mjs"
      - name: Lint new server and React code
        run: npx eslint src/state/livePresentationProjectionModel.mjs functions/livePresentationProjectionTriggers.mjs functions/presentationProjectionBackfillCommands.mjs functions/playerPresentationCommands.mjs frontend/src/dashboard/firebaseCampaignMediaService.mjs frontend/src/dashboard/CampaignMapWorkspace.jsx frontend/src/dashboard/CampaignPresentationWorkspace.jsx frontend/src/dashboard/HybridSessionManager.jsx frontend/src/combat/firebaseCombatService.mjs scripts/site-share-present-phase7-4.test.mjs scripts/site-share-present-phase7-4-emulator.test.mjs
      - name: React source checks
        run: npm run site:check
      - name: React production build
        run: npm run site:build
      - name: Verify compiled assets
        run: npm run site:verify-dist
