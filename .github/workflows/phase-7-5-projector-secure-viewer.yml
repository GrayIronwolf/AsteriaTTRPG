name: Phase 7.5 Projector and Secure Viewer Reconnection
on:
  push:
    branches: [feature/phase-7-5-projector-secure-viewer-reconnect]
  pull_request:
    paths:
      - 'frontend/src/dashboard/usePresentationDisplayRuntime.js'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.jsx'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.module.css'
      - 'frontend/src/dashboard/HybridSessionManager.jsx'
      - 'frontend/src/dashboard/HybridSessionManager.module.css'
      - 'scripts/site-share-present-phase7-5.test.mjs'
      - '.github/workflows/phase-7-5-projector-secure-viewer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projector-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Projector lifecycle, secure viewer, Phase 6/7 regression
        run: node --test scripts/site-share-present-phase7-5.test.mjs scripts/site-share-present-phase7-4.test.mjs scripts/site-share-present-phase7-3.test.mjs scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-1.test.mjs scripts/site-share-present-phase7-0.test.mjs scripts/site-combat-final-phase6-9.test.mjs
      - name: Firebase Firestore and Storage grants
        run: npx firebase emulators:exec --project demo-asteria-presentation-phase75 --only firestore,storage "node --test --test-concurrency=1 scripts/site-share-present-phase7-4-emulator.test.mjs scripts/site-share-present-phase7-3-emulator.test.mjs"
      - name: Lint Phase 7.5 and presentation views
        run: npx eslint frontend/src/dashboard/usePresentationDisplayRuntime.js frontend/src/dashboard/CampaignPresentationWorkspace.jsx frontend/src/dashboard/HybridSessionManager.jsx scripts/site-share-present-phase7-5.test.mjs
      - name: React source checks
        run: npm run site:check
      - name: React production build
        run: npm run site:build
      - name: Verify compiled assets
        run: npm run site:verify-dist
