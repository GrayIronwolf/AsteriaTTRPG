name: Phase 7.6 GM Screen Capture and Display Safety
on:
  push:
    branches: [feature/phase-7-6-gm-screen-capture-controls]
  pull_request:
    paths:
      - 'frontend/src/dashboard/GMScreenCaptureControls.jsx'
      - 'frontend/src/dashboard/GMScreenCaptureControls.module.css'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.jsx'
      - 'scripts/site-share-present-phase7-6.test.mjs'
      - 'scripts/site-share-present-phase7-5.test.mjs'
      - 'docs/PHASE-7-6-SCREEN-SHARING-FEASIBILITY.md'
      - '.github/workflows/phase-7-6-gm-screen-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen-capture-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 7.6 and earlier Phase 6/7 model regressions
        run: node --test scripts/site-share-present-phase7-6.test.mjs scripts/site-share-present-phase7-5.test.mjs scripts/site-share-present-phase7-4.test.mjs scripts/site-share-present-phase7-3.test.mjs scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-1.test.mjs scripts/site-share-present-phase7-0.test.mjs scripts/site-combat-final-phase6-9.test.mjs
      - name: Phase 7.3 Firebase media security (own emulator project)
        run: npx firebase emulators:exec --project demo-asteria-presentation-phase73 --only firestore,storage "node --test scripts/site-share-present-phase7-3-emulator.test.mjs"
      - name: Phase 7.4 Firebase combat and map security (own emulator project)
        run: npx firebase emulators:exec --project demo-asteria-share-present-phase74 --only firestore,storage "node --test scripts/site-share-present-phase7-4-emulator.test.mjs"
      - name: Lint capture controls, presentation and regression tests
        run: npx eslint frontend/src/dashboard/GMScreenCaptureControls.jsx frontend/src/dashboard/CampaignPresentationWorkspace.jsx scripts/site-share-present-phase7-6.test.mjs
      - name: React source checks
        run: npm run site:check
      - name: React production build
        run: npm run site:build
      - name: Verify compiled assets
        run: npm run site:verify-dist
