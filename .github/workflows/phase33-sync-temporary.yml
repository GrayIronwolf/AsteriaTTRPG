name: Phase 3.3 temporary bundle synchronization
on:
  push:
    branches: [feature/inventory-phase-3-3-consolidation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    if: github.repository == 'GrayIronwolf/AsteriaTTRPG' && github.ref == 'refs/heads/feature/inventory-phase-3-3-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit only generated React website bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- react-dist
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi
          git commit -m "build: synchronize Phase 3.3 website assets"
          git push origin HEAD:feature/inventory-phase-3-3-consolidation
