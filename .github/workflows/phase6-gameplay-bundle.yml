name: Build Phase 6 gameplay integration React assets
on:
  push:
    branches:
      - feature/phase6-update4-gameplay-integration-20261106
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/phase6-gameplay-bundle.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated production React assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build Phase 6 gameplay integration React bundle"
            git push origin HEAD:feature/phase6-update4-gameplay-integration-20261106
          fi
