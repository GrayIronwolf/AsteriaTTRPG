name: Build and browser-check Phase 7 tablet desktop
on:
  push:
    branches:
      - fix/phase7-update2-tablet-desktop-20261106
    paths:
      - 'src/**'
      - 'scripts/phase7-tablet-desktop-browser.cjs'
      - 'package.json'
      - '.github/workflows/phase7-tablet-browser.yml'
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify tablet and desktop layouts in Chromium
        run: node scripts/phase7-tablet-desktop-browser.cjs
      - name: Commit production React build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build Phase 7 tablet desktop dashboard assets"
            git push origin HEAD:fix/phase7-update2-tablet-desktop-20261106
          fi
