name: Milestone 3.5 - Verify and synchronize vision assets
on:
  push:
    branches: [milestone-3-5-automatic-vision-fog]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'js/firebase-auth.js'
      - '.github/workflows/rebuild-milestone-3-4-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: milestone-3-5-assets
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.ref == 'refs/heads/milestone-3-5-automatic-vision-fog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:combat
      - run: npm run test:digital-gm-integration
      - run: npm run build
      - name: Commit verified generated assets to milestone branch only
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize milestone 3.5 frontend assets"
          # A source or docs commit may have landed while the build ran.
          # Rebase the generated commit, then rebuild on that exact latest tree.
          git fetch origin milestone-3-5-automatic-vision-fog
          git rebase origin/milestone-3-5-automatic-vision-fog
          npm run build
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "build: verify milestone 3.5 assets after branch sync"
          fi
          git push origin HEAD:milestone-3-5-automatic-vision-fog
