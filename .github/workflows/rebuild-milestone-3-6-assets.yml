name: Milestone 3.6 - Verify and synchronize hybrid presentation assets
on:
  push:
    branches: [milestone-3-6-hybrid-presentation-recovery]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'js/firebase-auth.js'
      - '.github/workflows/rebuild-milestone-3-6-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone-3-6-assets
  cancel-in-progress: true

jobs:
  verify-build:
    if: github.ref == 'refs/heads/milestone-3-6-hybrid-presentation-recovery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/milestone-3-6-hybrid-recovery.test.mjs
      - run: npm run test:combat
      - run: npm run test:digital-gm-integration
      - run: npm run build
      - name: Commit verified generated assets to the 3.6 branch only
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize milestone 3.6 frontend assets"
          git fetch origin milestone-3-6-hybrid-presentation-recovery
          git rebase origin/milestone-3-6-hybrid-presentation-recovery
          npm run build
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "build: verify milestone 3.6 assets after branch sync"
          fi
          git push origin HEAD:milestone-3-6-hybrid-presentation-recovery
