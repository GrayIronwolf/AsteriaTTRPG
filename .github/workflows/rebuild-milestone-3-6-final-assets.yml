name: Milestone 3.6 final - Synchronize verified website assets
on:
  push:
    branches: [milestone-3-6-final-gameplay-acceptance]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/rebuild-milestone-3-6-final-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milestone-3-6-final-build
  cancel-in-progress: true

jobs:
  verify-and-rebuild:
    if: github.ref == 'refs/heads/milestone-3-6-final-gameplay-acceptance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/milestone-3-6-final-acceptance.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Commit verified website bundles on milestone branch only
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize milestone 3.6 final frontend assets"
          git fetch origin milestone-3-6-final-gameplay-acceptance
          git rebase origin/milestone-3-6-final-gameplay-acceptance
          npm run build
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "build: verify milestone 3.6 final assets after branch sync"
          fi
          git push origin HEAD:milestone-3-6-final-gameplay-acceptance
