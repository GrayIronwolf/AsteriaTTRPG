name: Synchronize Milestones 1-3 audit frontend assets
on:
  push:
    branches: [audit-milestones-1-2-3-integration]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/rebuild-milestones-1-2-3-audit-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: milestones-1-2-3-audit-assets
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.ref == 'refs/heads/audit-milestones-1-2-3-integration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/milestones-1-2-3-cross-system-audit.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Commit verified generated artifacts to audit branch only
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize Milestones 1-3 audit React assets"
          git fetch origin audit-milestones-1-2-3-integration
          git rebase origin/audit-milestones-1-2-3-integration
          npm run build
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "build: verify Milestones 1-3 audit assets after branch sync"
          fi
          git push origin HEAD:audit-milestones-1-2-3-integration
