name: Verify and rebuild player inventory milestone 4 assets
on:
  push:
    branches: [fix/player-inventory-equipment-m4]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - '.github/workflows/rebuild-player-inventory-equipment-m4.yml'
permissions:
  contents: write
concurrency:
  group: player-inventory-equipment-m4-bundle
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/fix/player-inventory-equipment-m4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified generated assets to fix branch
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize verified inventory and equipment assets"
          git push origin HEAD:fix/player-inventory-equipment-m4
