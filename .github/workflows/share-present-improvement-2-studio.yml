name: Share & Present Improvement 2 — GM Presentation Studio
on:
  push:
    branches: [feature/share-present-improvement-2-gm-studio]
  pull_request:
    paths:
      - 'src/state/presentationStudioModel.mjs'
      - 'frontend/src/dashboard/GMPresentationStudio.jsx'
      - 'frontend/src/dashboard/GMPresentationStudio.module.css'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.jsx'
      - 'frontend/src/dashboard/CampaignPresentationWorkspace.module.css'
      - 'frontend/src/pages/GMDashboardPage.jsx'
      - 'scripts/share-present-improvement-2.test.mjs'
      - '.github/workflows/share-present-improvement-2-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Studio and inherited presentation model tests
        run: node --test scripts/share-present-improvement-2.test.mjs scripts/share-present-improvement-1.test.mjs scripts/site-share-present-phase7-7.test.mjs scripts/site-share-present-phase7-6.test.mjs scripts/site-share-present-phase7-5.test.mjs
      - name: Studio model and React lint
        run: npx eslint src/state/presentationStudioModel.mjs frontend/src/dashboard/GMPresentationStudio.jsx frontend/src/dashboard/CampaignPresentationWorkspace.jsx frontend/src/pages/GMDashboardPage.jsx scripts/share-present-improvement-2.test.mjs
      - name: React build and source checks
        run: npm run site:check && npm run site:build && npm run site:verify-dist
