name: Share & Present Improvement 5 — Player Invitations
on:
  push:
    branches: [feature/share-present-improvement-5-player-invitations]
  pull_request:
    paths:
      - 'src/state/hybridInvitationModel.mjs'
      - 'src/state/hybridPresentationSessionModel.mjs'
      - 'functions/hybridInvitationResponse.mjs'
      - 'functions/hybridPresentationSessionCommands.mjs'
      - 'functions/handler.mjs'
      - 'frontend/src/dashboard/firebaseCampaignMediaService.mjs'
      - 'frontend/src/dashboard/HybridSessionManager.jsx'
      - 'frontend/src/dashboard/HybridSessionManager.module.css'
      - 'scripts/share-present-improvement-5.test.mjs'
      - 'scripts/share-present-improvement-5-emulator.test.mjs'
      - '.github/workflows/share-present-improvement-5-invitations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invitations-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 5 invitations and inherited security checks
        run: node --test scripts/share-present-improvement-5.test.mjs scripts/share-present-improvement-4.test.mjs scripts/share-present-improvement-3.test.mjs scripts/share-present-improvement-2.test.mjs scripts/share-present-improvement-1.test.mjs scripts/site-share-present-phase7-2.test.mjs scripts/site-share-present-phase7-7.test.mjs
      - name: Invitee status and access Firestore emulator tests
        run: npx firebase emulators:exec --project demo-asteria-invite5 --only firestore "node --test scripts/share-present-improvement-5-emulator.test.mjs"
      - name: React and Firebase lint
        run: npx eslint src/state/hybridInvitationModel.mjs src/state/hybridPresentationSessionModel.mjs functions/hybridInvitationResponse.mjs functions/hybridPresentationSessionCommands.mjs functions/handler.mjs frontend/src/dashboard/firebaseCampaignMediaService.mjs frontend/src/dashboard/HybridSessionManager.jsx scripts/share-present-improvement-5.test.mjs scripts/share-present-improvement-5-emulator.test.mjs
      - name: Source, build and verified assets
        run: npm run site:check && npm run site:build && npm run site:verify-dist
