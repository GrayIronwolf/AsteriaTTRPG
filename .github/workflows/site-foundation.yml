name: React/Vite site migration — Phase 2.1 header

on:
  pull_request:
    paths:
      - "frontend/**"
      - "vite.site.config.mjs"
      - "scripts/site-foundation-*"
      - "scripts/site-routing-*"
      - "scripts/site-design-*"
      - "scripts/site-js-*"
      - "scripts/site-acceptance-*"
      - "scripts/site-header-*"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/site-foundation.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vite.site.config.mjs"
      - "scripts/site-foundation-*"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/site-foundation.yml"
  workflow_dispatch:

jobs:
  preview-foundation:
    name: Build, lint and browser-verify isolated React app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run site:check
      - run: npm run site:build
      - run: npm run site:verify-dist
      - run: npx eslint frontend/src
      - name: Install Chromium for phase-specific browser regression
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - run: npm run site:browser
      - run: npm run site:routing-browser
      - run: npm run site:design-browser
      - run: npm run site:js-browser
      - name: Phase 2.1 header and logo browser regression
        run: npm run site:header-browser
      - name: Upload Phase 2.1 header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-1-header-evidence
          path: ${{ runner.temp }}/asteria-phase-2-1-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 1.5 integrated browser and offline legacy baseline
        run: npm run site:acceptance
      - name: Upload Phase 1.5 evidence screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-1-5-acceptance-evidence
          path: ${{ runner.temp }}/asteria-phase-1-5-evidence/
          retention-days: 30
          if-no-files-found: error
