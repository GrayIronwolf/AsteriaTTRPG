name: React/Vite site migration — Phase 4.2 Account Profile and Settings

on:
  pull_request:
    paths:
      - "frontend/**"
      - "vite.site.config.mjs"
      - "scripts/site-foundation-*"
      - "scripts/site-routing-*"
      - "scripts/site-design-*"
      - "scripts/site-js-*"
      - "scripts/site-acceptance-*"
      - "scripts/site-header-*"
      - "scripts/site-navigation-*"
      - "scripts/site-mega-*"
      - "scripts/site-home-*"
      - "scripts/site-appearance-*"
      - "scripts/site-integration-*"
      - "scripts/site-compendium-*"
      - "scripts/site-auth-*"
      - "scripts/site-retirement-*"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/site-foundation.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "vite.site.config.mjs"
      - "scripts/site-foundation-*"
      - "scripts/site-integration-*"
      - "scripts/site-retirement-*"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/site-foundation.yml"
  workflow_dispatch:

jobs:
  preview-foundation:
    name: Build, lint and browser-verify isolated React app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run site:check
      - name: Phase 2.5 deferred legacy retirement audit
        run: npm run site:retirement-audit
      - run: npm run site:build
      - run: npm run site:verify-dist
      - run: npx eslint frontend/src
      - name: Install Chromium for phase-specific browser regression
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install chromium
      - run: npm run site:browser
      - run: npm run site:routing-browser
      - run: npm run site:design-browser
      - run: npm run site:js-browser
      - name: Phase 3.3 public search and category browser regression
        run: npm run site:discovery-browser
      - name: Upload Phase 3.3 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-3-3-discovery-evidence
          path: ${{ runner.temp }}/asteria-phase-3-3-discovery-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 3.2 public Compendium entries and safe Markdown browser regression
        run: npm run site:entry-browser
      - name: Upload Phase 3.2 entry-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-3-2-entry-evidence
          path: ${{ runner.temp }}/asteria-phase-3-2-entry-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 3.1 public Compendium catalogue browser tests
        run: npm run site:compendium-browser
      - name: Upload Phase 3.1 Compendium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-3-1-compendium-evidence
          path: ${{ runner.temp }}/asteria-phase-3-1-compendium-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 2.5 integrated React regression and safe synthetic identity fixture
        run: npm run site:integration-browser
      - name: Upload Phase 2.5 integration screenshots, metrics and cleanup ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-5-integration-evidence
          path: ${{ runner.temp }}/asteria-phase-2-5-integration-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 2.4 appearance settings browser regression
        run: npm run site:appearance-browser
      - name: Upload Phase 2.4 appearance screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-4-appearance-evidence
          path: ${{ runner.temp }}/asteria-phase-2-4-appearance-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 2.3 cinematic Home and Forge cards browser regression
        run: npm run site:home-browser
      - name: Upload Phase 2.3 Home screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-3-home-evidence
          path: ${{ runner.temp }}/asteria-phase-2-3-home-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 2.2 mega-menu interaction and layout browser regression
        run: npm run site:mega-browser
      - name: Upload Phase 2.2 navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-2-navigation-evidence
          path: ${{ runner.temp }}/asteria-phase-2-2-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Phase 2.1 header and logo browser regression
        run: npm run site:header-browser
      - name: Upload Phase 2.1 header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-2-1-header-evidence
          path: ${{ runner.temp }}/asteria-phase-2-1-evidence/
          retention-days: 30
          if-no-files-found: error
      # No live Firebase credentials: use Auth/Firestore demo emulators and
      # rebuild only AFTER all guest/legacy browser checks finish.
      - name: Build opt-in isolated React Auth preview for demo emulator
        env:
          VITE_ASTERIA_AUTH_ENABLED: 'true'
          VITE_FIREBASE_MODE: emulator
        run: npm run site:build
      - name: Set up Java 21 for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Phase 4.1/4.2 authenticated account and profile emulator browser tests
        timeout-minutes: 8
        run: npx firebase emulators:exec --project demo-asteria --only auth,firestore,storage "npm run site:auth-browser"
      - name: Upload Phase 4.1 Firebase Auth acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-4-2-account-evidence
          path: ${{ runner.temp }}/asteria-phase-4-1-auth-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Restore offline guest preview after emulator testing
        run: npm run site:build
      - name: Phase 1.5 integrated browser and offline legacy baseline
        run: npm run site:acceptance
      - name: Upload Phase 1.5 evidence screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-phase-1-5-acceptance-evidence
          path: ${{ runner.temp }}/asteria-phase-1-5-evidence/
          retention-days: 30
          if-no-files-found: error
