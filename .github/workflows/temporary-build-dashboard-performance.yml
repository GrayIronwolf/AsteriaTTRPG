# Temporary feature-branch-only builder, removed after refreshing the checked-in bundle.
name: Rebuild optimized dashboard bundle
on:
  push:
    branches:
      - perf/dashboard-render-load-20261106
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/perf/dashboard-render-load-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:dashboard
      - run: npm run test:ui
      - run: npm run build
      - name: Commit generated browser bundle to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate optimized dashboard JavaScript bundle"
            git push origin HEAD:perf/dashboard-render-load-20261106
          fi
