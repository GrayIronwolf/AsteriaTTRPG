name: Temporary dashboard customisation build and test
on:
  push:
    branches:
      - feature/dashboard-panel-customisation-20261105
permissions:
  contents: write
jobs:
  verify-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact dependencies
        run: npm ci
      - name: Validate full application and Firebase emulators
        run: |
          npm run audit:production
          npm run content:check
          npm run lint
          npm test
          node scripts/test-xp-realtime-sync.js
          node --test scripts/data-sync-regression.test.mjs
          npm run test:firebase
          npm run build
          git diff --check
      - name: Commit verified production assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate verified dashboard customisation bundles"
            git push origin HEAD:feature/dashboard-panel-customisation-20261105
          fi
