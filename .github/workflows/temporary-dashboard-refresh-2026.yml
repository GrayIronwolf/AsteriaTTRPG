name: Temporary verified dependency and dashboard asset refresh
on:
  push:
    branches:
      - fix/dashboard-build-and-security-20261105

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve pinned dependency upgrades on repair branch
        run: npm install --no-fund
      - name: Apply compatible production security fixes
        run: npm audit fix --omit=dev --no-fund
      - name: Verify reproducible installation
        run: npm ci
      - name: Test content, lint, gameplay, Firebase and build
        run: |
          npm run content:check
          npm run lint
          npm test
          node scripts/test-xp-realtime-sync.js
          node --test scripts/data-sync-regression.test.mjs
          npm run test:firebase
          npm run build
          git diff --check
      - name: Enforce production dependency security gate
        run: npm run audit:production
      - name: Commit reproducible lockfile and generated site assets to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package.json package-lock.json react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Refresh patched dependencies and verified dashboard bundles"
            git push origin HEAD:fix/dashboard-build-and-security-20261105
          else
            echo "No generated or lockfile changes required."
          fi
