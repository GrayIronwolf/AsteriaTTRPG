# Temporary feature branch builder. Remove before merging.
name: Verify and rebuild optimized dashboard bundle
on:
  push:
    branches:
      - perf/dashboard-render-load-20261106
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: timeout 90s npm test
      - run: npm run build
      - name: Commit rebuilt browser bundle to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Refresh production React bundle after clock guard fix"
            git push origin HEAD:perf/dashboard-render-load-20261106
          fi
