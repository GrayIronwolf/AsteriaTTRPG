name: Temporary dashboard panel bundle verification
on:
  push:
    branches: [ui/player-gm-panel-reliability-20261105]
permissions:
  contents: write
jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and verify
        run: |
          npm ci
          npm run audit:production
          npm run content:check
          npm run lint
          npm test
          node scripts/test-xp-realtime-sync.js
          node --test scripts/data-sync-regression.test.mjs
          npm run test:firebase
          npm run build
          git diff --check
      - name: Commit generated bundles from verified build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dashboard panel bundles after verification"
            git push origin HEAD:ui/player-gm-panel-reliability-20261105
          fi
