name: Temporary Royal Relic v2 validation and bundle build
on:
  push:
    branches: [fix/royal-relic-panel-textures-20261105]
permissions:
  contents: write
jobs:
  verify-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application and build Royal Relic assets
        run: |
          npm run audit:production
          npm run content:check
          npm run lint
          npm test
          npm run test:firebase
          npm run build
          git diff --check
      - name: Commit verified generated website bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Royal Relic v2 production bundle and textured assets"
            git push origin HEAD:fix/royal-relic-panel-textures-20261105
          fi
