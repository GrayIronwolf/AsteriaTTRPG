name: Temporary synchronize compiled dashboard assets
on:
  push:
    branches:
      - feature/dashboard-panel-sizes-backgrounds-20261105
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated React website bundle
        shell: bash
        run: |
          git add -A -- react-dist
          if git diff --cached --quiet; then
            echo "Generated website bundle already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync compiled React bundle with four-size dashboard update"
          git push origin HEAD:refs/heads/feature/dashboard-panel-sizes-backgrounds-20261105
