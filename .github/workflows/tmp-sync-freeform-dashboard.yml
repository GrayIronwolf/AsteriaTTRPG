name: Temporary sync freeform dashboard production assets
on:
  push:
    branches: [feature/12-column-freeform-dashboard-20261105]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated website bundle
        run: |
          git add -A -- react-dist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync freeform dashboard production bundle"
          git push origin HEAD:refs/heads/feature/12-column-freeform-dashboard-20261105
