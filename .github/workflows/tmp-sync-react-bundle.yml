name: Temporary synchronize compiled React dashboard bundle
on:
  push:
    branches:
      - fix/sync-react-build-after-dashboard-grid-20261105
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit only the generated React website assets
        shell: bash
        run: |
          git add -A -- react-dist
          if git diff --cached --quiet; then
            echo "Bundled website assets already match source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync compiled dashboard bundle with three-column source"
          git push origin HEAD:refs/heads/fix/sync-react-build-after-dashboard-grid-20261105
