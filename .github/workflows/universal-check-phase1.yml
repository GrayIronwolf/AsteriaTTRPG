name: Universal Check Phase 1 verification
on:
  push:
    branches: [feat/universal-check-requests-phase-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/universal-check-model.test.mjs
      - run: npm run lint
      - run: npm run build
