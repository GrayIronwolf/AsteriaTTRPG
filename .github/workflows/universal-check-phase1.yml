name: Universal Check Phase 1 verification
on:
  push:
    branches: [feat/universal-check-requests-phase-1]
  pull_request:
    paths:
      - 'functions/universalCheckCommands.mjs'
      - 'src/state/universalCheckModel.mjs'
      - 'src/dashboards/UniversalCheckWorkspace.jsx'
      - 'firestore.rules'
      - 'scripts/universal-check-*.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Universal Check model and backend tests
        run: node --test scripts/universal-check-model.test.mjs scripts/universal-check-phase1.test.mjs
      - name: Lint
        run: npm run lint
      - name: Existing dashboard and combat regression tests
        run: npm run test:dashboard && npm run test:combat
      - name: Firestore security rules emulator tests
        run: npx firebase emulators:exec --project demo-asteria-universal-check --only firestore "node --test scripts/universal-check-permissions-emulator.test.mjs"
      - name: Production React build
        run: npm run build
