name: Verify and compile Battle Map switch fix (no deployment)
on:
  push:
    branches: [fix/battle-map-switch-refresh]
permissions:
  contents: write
concurrency:
  group: battle-map-switch-assets
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify map switch and existing media tests
        run: |
          node --test scripts/battle-map-selection-switch.test.mjs
          node --test scripts/battle-map-media.test.mjs
          npm run lint
      - run: npm run build
      - name: Commit compiled website assets to feature branch only
        run: |
          set -euo pipefail
          git add -A -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
          if git diff --cached --quiet; then exit 0; fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(maps): synchronize switching fix assets [skip ci]"
          git fetch --no-tags origin fix/battle-map-switch-refresh
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
            echo 'Branch advanced: avoid pushing a stale frontend build.'
            exit 1
          fi
          git push origin HEAD:fix/battle-map-switch-refresh
