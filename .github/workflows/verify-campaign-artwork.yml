name: Verify Campaign Artwork Release
on:
  push:
    branches: [feat/campaign-artwork-forge-manager]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run audit:production
      - run: npm run content:check
      - run: npm run lint
      - run: npm test
      - run: node scripts/test-xp-realtime-sync.js
      - run: node --test scripts/data-sync-regression.test.mjs
      - run: npm run test:firebase
      - run: npm run build
      - name: Verify production bundle matches source
        run: git diff --exit-code -- react-dist data/compendium.js data/compendium-handbook.js data/compendium-index.js data/compendium-parts
